                 hidden: { label: "물가 살펴보기", tier: 3, gold: 25, text: "물속에서 반짝이는 보물상자를 건져 올렸다!" } },
    gate:      { guard: true }
  };

  /* 버튼 하나를 만들어 선택지 칸에 붙이는 도우미 함수
     group을 쓰면 "이동 / 행동 / 도전" 묶음 안에 들어가고, sub는 버튼 아래 작은 보조 글입니다. */
  const GROUPS = { move: "이동", act: "행동 (판정 없음)", roll: "도전 (주사위 판정 필요)" };
  function groupBox(k) {
    let box = document.querySelector(`#choices [data-k="${k}"]`);
    if (!box) {
      box = document.createElement("div");
      box.className = "grp"; box.dataset.k = k;
      const t = document.createElement("div"); t.className = "grp-title"; t.textContent = GROUPS[k];
      const bs = document.createElement("div"); bs.className = "grp-btns";
      box.appendChild(t); box.appendChild(bs);
      $("choices").appendChild(box);
    }
    return box.querySelector(".grp-btns");
  }
  function addBtn(label, fn, cls, group, sub) {
    const b = document.createElement("button");
    b.textContent = label;
    if (sub) { const sp = document.createElement("span"); sp.className = "sub"; sp.textContent = sub; b.appendChild(sp); }
    if (cls) b.className = cls;
    b.addEventListener("click", fn);
    (group ? groupBox(group) : $("choices")).appendChild(b);
    return b;
  }

  /* ===== [30] 프로필과 인벤 =====
     HERO_LEVEL, MANA : 아직 게임에 쓰이지 않는 표시용 값 (나중에 레벨·마력 기능을 만들 때 사용)
     PORTRAIT_URL     : 초상화 그림 주소. 비워 두면 '초상화' 자리 표시만 나옴 */
  let heroName = "모험가";
  const HERO_LEVEL = 1;
  const MANA = 10, MANA_MAX = 10;
  const PORTRAIT_URL = "";
  /* 장비 칸: 인벤 그림의 칸 이름 → 장비 데이터의 slot (무기는 오른손, 방어구는 몸통. 나머지 칸은 아직 장비가 없음) */
  const DOLL = [["머리", "head"], ["팔", "arm"], ["몸통", "body", "방어구"], ["등", "back"], ["왼손", "lh"], ["오른손", "rh", "무기"], ["다리", "legs"]];
  /* 가방 아이콘 */
  const ITEM_ICON = { "회어": "🐟", "금린어": "🐠", "약초": "🌿", "독초": "☘️", "산딸기": "🍓", "나무 열매": "🌰", "버섯": "🍄", "독버섯": "🍄",
    "선인장 열매": "🌵", "회전초": "🌾", "철광석": "🪨", "유물 조각": "🏺", "낚싯대": "🎣", "곡괭이": "⛏️", "행운의 부적": "🍀",
    "마법 주사위": "🎲", "수정 주사위": "💎", "알토의 꾸러미": "📦", "포체의 편지": "✉️" };
  const BAG_PAGE = 20, BAG_TABS = 4;   // 한 쪽에 20칸(4×5), 쪽은 4개
  let bagPage = 0, bagSel = null;
  const BONUS_ORDER = [["근력", "정신", "민첩"], ["감지", "재주", "지력", "행운"]];   // 프로필의 판정 보정 표시 순서

  function updateStatus() {
    const r = stamina / STAMINA_MAX;
    $("heroName").textContent = heroName;
    $("lvText").textContent = HERO_LEVEL;
    $("hpText").textContent = `${stamina} / ${STAMINA_MAX}`;
    $("hpBar").style.width = (r * 100) + "%";
    $("hpBar").style.background = r > 0.5 ? "var(--ac)" : r > 0.25 ? "var(--rl)" : "var(--hero)"; // 체력이 줄면 초록 → 주황 → 빨강
    $("mpText").textContent = `${MANA} / ${MANA_MAX}`;
    $("mpBar").style.width = (MANA / MANA_MAX * 100) + "%";
    $("goldText").textContent = gold;
    $("diceText").textContent = extraDice() ? `1D20 ×${1 + extraDice()}` : "1D20";
    const busy = moving || !!battle;
    // 장비 칸: 착용 중인 칸을 누르면 벗음
    const doll = $("doll"); doll.innerHTML = "";
    for (const [label, area, slot] of DOLL) {
      const n = slot ? equipped[slot] : null;
      const c = el(n ? "button" : "div", "slot" + (n ? " on" : " empty"));
      c.style.gridArea = area;
      c.textContent = n ? gearIcon(n) : (slot === "무기" ? "✊" : "");
      c.appendChild(el("span", "sl", label));
      if (n) {
        c.title = `${label}: ${n} (${gearDesc(recipes[n])}) · 눌러서 벗기`;
        c.disabled = busy;
        c.addEventListener("click", () => unequip(slot));
      } else c.title = slot === "무기" ? `${label}: 맨손 (근거리·근력)` : `${label}: 비어 있음`;
      doll.appendChild(c);
    }
    const sum = bonusText(totalBonus());
    $("atkText").textContent = `공격: ${attackStat()}${sum === "효과 없음" ? "" : " · 장비 " + sum}`;
    // 가방: 착용하지 않은 장비(눌러서 착용) + 재료·도구
    const spare = Object.keys(owned).filter(n => equipped[recipes[n].slot] !== n);
    const items = [...spare.map(n => ({ n, gear: true })), ...Object.entries(bag).filter(([, c]) => c > 0).map(([n, c]) => ({ n, c }))];
    bagPage = Math.min(bagPage, BAG_TABS - 1);
    const tabs = $("invTabs"); tabs.innerHTML = "";
    for (let t = 0; t < BAG_TABS; t++) {
      const b = el("button", t === bagPage ? "on" : "", String(t + 1));
      b.addEventListener("click", () => { bagPage = t; updateStatus(); });
      tabs.appendChild(b);
    }
    const grid = $("bagGrid"); grid.innerHTML = "";
    const page = items.slice(bagPage * BAG_PAGE, (bagPage + 1) * BAG_PAGE);
    for (let k = 0; k < BAG_PAGE; k++) {
      const it = page[k];
      if (!it) { grid.appendChild(el("div", "cell")); continue; }
      const c = el("button", "cell" + (it.gear ? " gear" : "") + (bagSel === it.n ? " sel" : ""), it.gear ? gearIcon(it.n) : (ITEM_ICON[it.n] || "📦"));
      if (it.c > 1) c.appendChild(el("span", "cnt", String(it.c)));
      c.title = it.gear ? `${it.n} · 눌러서 착용 (${gearDesc(recipes[it.n])})` : `${it.n}${it.c > 1 ? " ×" + it.c : ""}`;
      if (it.gear) { c.disabled = busy; c.addEventListener("click", () => { bagSel = null; equipFromBag(it.n); }); }
      else c.addEventListener("click", () => { bagSel = it.n; updateStatus(); });
      grid.appendChild(c);
    }
    const sel = bagSel && bag[bagSel] ? bagSel : null;
    $("bagInfo").textContent = sel ? `${ITEM_ICON[sel] || "📦"} ${sel} ×${bag[sel]}${ITEM_INFO[sel] ? " · " + ITEM_INFO[sel] : sellPrice[sel] ? ` · 재료 (기본 판매가 💰${sellPrice[sel]})` : ""}`
      : items.length ? "장비(점선 칸)는 눌러서 착용, 착용한 칸을 누르면 벗기" : "가방이 비어 있다.";
    renderStats();
    renderQuest();
  }

  /* ===== [25] 이야기 칸: 대사와 장소 묘사는 타자를 치듯 한 글자씩, 클릭하면 바로 전부 나옴 =====
     온점(.)이 나오면 잠깐 쉬었다가 이어서 출력 (말줄임표 ...도 점마다 쉼). 쉼표(,)에서도 똑같이 쉼
     NPC 이름은 굵게: "상인, 케르트 | 대사" 의 앞부분, "[상인 포체] 대사" 처럼 줄 맨 앞 대괄호 안의 NPC 이름 */
  const TYPE_MS = 28;          // 한 글자가 나오는 간격(밀리초)
  const PERIOD_PAUSE = 380;    // 온점 뒤에 쉬는 시간(밀리초)
  const SECTION_PAUSE = 1000;  // 장소 설명이 끝나고 이야기 칸 글이 시작되기 전에 쉬는 시간(밀리초)

  const NPC_ROLE = /^(상인|대장장이|여관 주인|경비원|교관)(\s|$)/;
  /* 굵게 표시할 글자 범위 [시작, 끝) 목록 */
  /* NPC 이름표 범위 [시작, 끝, 이름] 목록: 줄 맨 앞의 "여관 주인, 알토 | " 또는 "[상인 포체] " 전체 */
  function speakerRanges(t) {
    const out = []; let pos = 0;
    for (const line of t.split("\n")) {
      let m;
      if ((m = line.match(/^([^|\[\]\n]{1,24}?) \| /))) out.push([pos, pos + m[0].length, m[1]]);
      else if ((m = line.match(/^\[([^\]\n]+)\] ?/)) && NPC_ROLE.test(m[1])) out.push([pos, pos + m[0].length, m[1]]);
      pos += line.length + 1;
    }
    return out;
  }
  const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;" };
  const esc = t => t.replace(/[&<>]/g, c => ESC[c]);
  /* 전체 글 중 앞의 n글자를 HTML로 만듦. NPC 이름표는 각진 네모 한 덩어리(.npc)로 바꿔서 보여 줌
     (타자로 쪼개지지 않고, 양쪽 정렬에도 늘어나지 않음) */
  function storyHTML(full, n) {
    const rs = speakerRanges(full); let html = "", k = 0;
    while (k < n) {
      const r = rs.find(([a]) => a === k);
      if (r) { if (n >= r[1]) html += `<span class="npc">${esc(r[2])}</span>`; k = r[1]; continue; }
      html += ESC[full[k]] || full[k]; k++;
    }
    return html.split("\n").map(l => `<span class="ln">${l}</span>`).join("");   // 한 줄(엔터 단위)씩 묶음: 행간 조절용
  }

  /* 타자 칸 두 개: loc = 장소 설명 칸, sto = 이야기 칸.
     이야기 칸의 타자는 장소 설명이 다 나온 뒤에 시작합니다 (wait). */
  const loc = { p: "locText", card: "locCard", text: "", job: null };
  const sto = { p: "story", card: "storyCard", text: "", job: null, wait: loc };
  let storyText = "";          // 지금 이야기 칸에 들어 있는 전체 글

  function showIn(T, t) { T.text = t; if (T === sto) storyText = t; $(T.p).innerHTML = storyHTML(t, t.length); }
  const seenText = new Set();   // 이미 끝까지 나온 적 있는 글: 다시 나올 때는 타자 효과 없이 한 번에
  function stopIn(T, finish) {
    if (!T.job) return;
    clearTimeout(T.job.timer);
    const full = T.job.full; T.job = null;
    if (finish) { showIn(T, full); seenText.add(full); }
    $(T.card).classList.remove("typing"); $(T.card).title = "";
  }
  function typeIn(T, t) {
    stopIn(T, false);
    const p = $(T.p), card = $(T.card);
    p.innerHTML = ""; T.text = t; if (T === sto) storyText = t;
    const job = T.job = { full: t, i: 0, timer: null };
    card.classList.add("typing"); card.title = "클릭하면 바로 전부 보기";
    const step = () => {
      if (T.job !== job) return;
      if (T.wait && T.wait.job) { job.waited = true; job.timer = setTimeout(step, 80); return; } // 장소 설명이 끝날 때까지 기다림
      if (job.waited) { job.waited = false; job.timer = setTimeout(step, SECTION_PAUSE); return; } // 장소 설명 → 이야기 칸으로 넘어갈 때 길게 쉼
      if (seenText.has(job.full)) { job.i = job.full.length; p.innerHTML = storyHTML(job.full, job.i); return stopIn(T, true); } // 본 적 있는 글
      const k = job.i;
      const sp = (k === 0 || job.full[k - 1] === "\n") ? speakerLen(job.full, k) : 0;
      let wait;
      if (sp) { job.i = k + sp; wait = PERIOD_PAUSE; }                      // "여관 주인, 알토 | " 는 한 번에 나오고 온점처럼 쉼
      else { job.i++; wait = pauseAfter(job.full[job.i - 1], job.full[job.i]); }
      p.innerHTML = storyHTML(job.full, job.i);
      if (T === sto) p.scrollTop = p.scrollHeight;                           // 긴 글은 따라 내려감
      if (job.i >= job.full.length) return stopIn(T, true);
      job.timer = setTimeout(step, wait);
    };
    job.timer = setTimeout(step, TYPE_MS);
  }

  /* 글자 뒤에 쉬는 시간: 온점·쉼표·느낌표·물음표에서 쉼 (말줄임표는 점마다).
     ?! 처럼 느낌표·물음표가 붙어 있으면 앞 글자에서는 쉬지 않고 마지막 글자에서만 쉼 */
  function pauseAfter(ch, next) {
    if (ch === "." || ch === ",") return PERIOD_PAUSE;
    if (ch === "!" || ch === "?") return (next === "!" || next === "?") ? TYPE_MS : PERIOD_PAUSE;
    return TYPE_MS;
  }
  /* 줄 맨 앞의 말하는 사람 표시 길이: "여관 주인, 알토 | " 또는 "[상인 포체] " (없으면 0) */
  function speakerLen(t, k) {
    const end = t.indexOf("\n", k), line = t.slice(k, end < 0 ? t.length : end);
    let m;
    if ((m = line.match(/^[^|\[\]\n]{1,24}? \| /))) return m[0].length;
    if ((m = line.match(/^\[([^\]\n]+)\] ?/)) && NPC_ROLE.test(m[1])) return m[0].length;
    return 0;
  }

  /* ===== [31] 선택지 차례대로 보이기: 장소 설명과 이야기가 모두 나온 뒤에 선택지가 하나씩 나타남 =====
     이야기 칸을 클릭하면 글과 선택지가 바로 전부 나옴. 글이 타자로 나오는 중이 아니면 선택지는 바로 보임 */
  const CHOICE_UNIT = "#choices > button, #choices .grp-btns > button, #choices .menu-head, #choices .sec-title, #choices .mrow, #choices .menu-empty";
  const CHOICE_GAP = 120;      // 선택지가 하나씩 나오는 간격(밀리초)
  let choiceQueue = [], choiceTimer = null, choiceScan = null;
  function typingNow() { return !!(loc.job || sto.job); }
  function scanChoices() {
    choiceScan = null;
    const fresh = [...document.querySelectorAll(CHOICE_UNIT)].filter(u => !u.dataset.seen);
    if (!fresh.length) return;
    fresh.forEach(u => u.dataset.seen = "1");
    choiceQueue = choiceQueue.filter(u => u.isConnected);
    if (!typingNow() && !choiceQueue.length) return;          // 글이 다 나와 있으면 바로 보임
    fresh.forEach(u => u.classList.add("pending"));
    choiceQueue.push(...fresh);
    if (!choiceTimer) choiceTimer = setTimeout(revealNext, CHOICE_GAP);
  }
  function revealNext() {
    choiceTimer = null;
    choiceQueue = choiceQueue.filter(u => u.isConnected);
    if (!choiceQueue.length) return;
    if (typingNow()) { choiceTimer = setTimeout(revealNext, 80); return; }   // 글이 끝날 때까지 기다림
    choiceQueue.shift().classList.remove("pending");
    if (choiceQueue.length) choiceTimer = setTimeout(revealNext, CHOICE_GAP);
  }
  function revealAllChoices() {
    clearTimeout(choiceTimer); choiceTimer = null;
    choiceQueue.forEach(u => u.classList.remove("pending")); choiceQueue = [];
  }
  new MutationObserver(() => { if (!choiceScan) choiceScan = setTimeout(scanChoices, 0); })
    .observe(document.getElementById("choices"), { childList: true, subtree: true });

  /* 이야기 칸 */
  function stopTyping(finish) { stopIn(sto, finish); }
  /* 바로 보여 주기 (주사위 결과, 전투 기록, 남은 시간 등) */
  function setStory(t) { stopIn(sto, false); showIn(sto, t); const p = $("story"); p.scrollTop = p.scrollHeight; }
  /* 뒤에 덧붙이기: 타자 중이면 타자로 이어서 나옴 */
  function appendStory(t) { if (sto.job) { sto.job.full += t; sto.text = storyText = sto.job.full; } else setStory(storyText + t); }
  /* 타자로 보여 주기 (대사) */
  function typeStory(t) { typeIn(sto, t); }

  /* 장소 설명 칸: 이름은 바로 바뀌고, 설명 글이 지금과 다를 때만 새로 타자로 나옴 */
  function setLoc(name, text, force) {
    $("locName").textContent = name;
    if (!force && text === loc.text) return;
    typeIn(loc, text || "");
  }

  /* NPC 대사 앞에 [이름]을 붙임. 이미 "여관 주인, 알토 | 대사" 형식이면 그대로 */
  function npcLine(npc, t) { return /^[^|\n]{1,24} \| /.test(t) ? t : `[${npc}] ${t}`; }

  /* 작은 요소 만들기 도우미 */
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function gearIcon(n) { const r = recipes[n]; return r.wtype ? WEAPON_TYPES[r.wtype].icon : "🛡"; }

  /* 지금 화면: place(장소) / shop / smith / train. 가방에서 장비를 바꿔 낀 뒤 같은 화면을 다시 그릴 때 씀 */
  let screen = "place";
  function equipFromBag(n) {
    if (moving || battle || !owned[n]) return;
    equipped[recipes[n].slot] = n;
    redraw(`${josa(n, "을", "를")} 착용했다. (공격: ${attackStat()} / 장비 효과: ${bonusText(totalBonus())})`);
  }
  /* 인벤의 장비 칸을 누르면 벗음 (무기를 벗으면 맨손) */
  function unequip(slot) {
    if (moving || battle || !equipped[slot]) return;
    const n = equipped[slot]; equipped[slot] = null;
    redraw(`${josa(n, "을", "를")} 벗었다. (공격: ${attackStat()} / 장비 효과: ${bonusText(totalBonus())})`);
  }
  /* 지금 화면을 결과 문장과 함께 다시 그림 */
  function redraw(msg) {
    if (screen === "shop") showShop(msg); else if (screen === "smith") showSmith(msg); else if (screen === "train") showTraining(msg); else if (screen === "inn") showInn(msg); else say(msg);
  }

  /* 결과 문장을 보여주되, 지금 장소의 버튼들은 그대로 다시 띄웁니다 */
  function say(msg) { refresh(); setStory(msg); }

  /* 지금 장소에 맞는 행동 버튼: [행동(판정 없음)] 묶음을 먼저, [도전(주사위 판정)] 묶음을 그 다음에 추가합니다 (refresh에서 호출) */
  function addActionButtons() {
    const a = actions[current]; if (!a) return;
    questButtons();                                                                  // 의뢰 대화는 판정이 없는 행동
    const qmark = b => ({ offer: " · ❗ 새 의뢰", report: " · ❓ 의뢰 보고" })[questHere(b)] || "";
    if (a.shop) addBtn("상인에게 가기", () => showShop(), "", "act", `상인 ${a.npc.shop} · 물건 사기 / 재료 팔기${qmark("shop")}`);
    if (a.smith) {
      addBtn("대장간", () => showSmith(), "", "act", `대장장이 ${a.npc.smith} · 장비 제작 / 착용`);
      addBtn("훈련장", () => showTraining(), "", "act", "금화로 스탯 올리기");
    }
    if (a.rest && (TOWN_TALK[current] || {}).innHello) addBtn("여관에 가기", () => showInn(), "", "act", `여관 주인 ${a.npc.inn} · 체력 ${stamina}/${STAMINA_MAX}${qmark("inn")}`);
    else if (a.rest) addBtn("여관에서 쉬기", rest, "", "act", `여관 주인 ${a.npc.inn} · 체력 회복 (${stamina}/${STAMINA_MAX})`);
    if (a.guard) addBtn("경비원과 이야기하기", talkGuard, "", "act", "관문 너머 로렌시아 제국");
    for (const g of a.gather || []) {                                                // 여기부터는 주사위 판정이 필요한 행동
      const sub = `${g.stat} 판정 / ${tierText(g.tier)} / ${challengeTime(g.tier)}초 · ${g.items.map(x => x[0]).join("·")}`;
      if (g.tool && !bag[g.tool]) { addBtn(g.label, () => {}, "", "roll", `${g.tool} 필요 · ${g.items.map(x => x[0]).join("·")}`).disabled = true; continue; }
      const key = current + ":" + g.label;
      const b = addBtn(g.label, () => doChallenge(doingOf(g), g.tier, () => gather(g), key), "", "roll", sub);
      if (coolLeft(key)) markCooldown(b, key);
    }
    const sc = a.secret;
    if (sc && !secretFound[roadKey(...sc.road)]) {
      const key = current + ":" + sc.label;
      const b = addBtn(sc.label, () => doChallenge("숨겨진 길을 찾는", sc.tier, () => searchSecret(sc), key), "", "roll",
        `감지 판정 / ${tierText(sc.tier)} / ${challengeTime(sc.tier)}초`);
      if (coolLeft(key)) markCooldown(b, key);
    }
    const h = a.hidden;
    if (h && !found[current]) {
      const key = current + ":" + h.label;
      const b = addBtn(h.label, () => doChallenge(doingOf(h), h.tier, () => searchHidden(h), key), "", "roll",
        `감지 판정 / ${tierText(h.tier)} / ${challengeTime(h.tier)}초`);
      if (coolLeft(key)) markCooldown(b, key);
    }
  }

  /* 채집: 목표 이상이면 성공. 재료는 확률대로 하나를 고르고(크리티컬이면 귀한 재료 확정), 목표보다 6 이상 높으면 2개 */
  function pickItem(items) {
    let r = Math.random() * items.reduce((t, x) => t + x[1], 0);
    for (const [n, w] of items) { if ((r -= w) < 0) return n; }
    return items[0][0];
  }
  function gather(g) {
    const ck = check(statBonus(g.stat), g.need), ok = ck.ok, qty = ok ? ((ck.crit || ck.total >= g.need + 6) ? 2 : 1) : 0;
    const item = ck.crit ? g.items[g.items.length - 1][0] : pickItem(g.items);
    if (qty) bag[item] = (bag[item] || 0) + qty;
    say(`${ck.text} (목표 ${g.need}) → ${ok ? "성공!" : "실패..."}\n` + (ok ? `${item} ${qty}개를 얻었다.` : "아무것도 얻지 못했다. 다시 도전해 보자."));
  }

  /* 숨겨진 길 찾기: 성공하면 길이 지도에 나타나고 이동할 수 있게 됨 */
  function searchSecret(sc) {
    const ck = check(statBonus("감지"), sc.need), ok = ck.ok;
    if (ok) { secretFound[roadKey(...sc.road)] = true; buildLinks(); drawMap(); placeHero(current); }
    say(`${ck.text} (목표 ${sc.need}) → ${ok ? "성공!" : "실패..."}\n` + (ok ? sc.text : "무너진 벽만 보일 뿐, 길은 찾지 못했다."));
  }

  /* 관문 경비원 */
  function talkGuard() {
    say(""); typeStory("[경비원] 멈추시오. 로렌시아 제국으로 가는 길은 지금 출입이 금지되어 있소. 위에서 명령이 내려올 때까지는 누구도 지나갈 수 없소.");
  }

  /* 숨겨진 보물 찾기: 성공하면 금화를 얻고, 그 보물은 사라집니다 */
  function searchHidden(h) {
    const ck = check(statBonus("감지"), h.need), ok = ck.ok;
    if (ok) { found[current] = true; gold += h.gold; }
    say(`${ck.text} (목표 ${h.need}) → ${ok ? "성공!" : "실패..."}\n` + (ok ? `${h.text} 금화 ${h.gold}닢을 얻었다!` : "아무것도 찾지 못했다. 다시 도전해 보자."));
  }

  /* ===== [27] 마을 대사: 엑셀 '스크립트_공통'에서 가져온 상점·여관 문장 (아직 비어 있는 칸은 예전 문장을 씀) =====
     shopHello: 상점에 들어갈 때 / shopStory: 상인 이야기 / shopAfter: 이야기를 들은 뒤 들어갈 때
     shopBase / innBase: 건물에 들어가면 장소 설명 칸에 나오는 건물 묘사
     innHello: 여관에 들어갈 때 / innStory: 여관 주인 이야기 / innRest: 쉴 때 / innAfter: 쉬고 나올 때 / innFull: 체력이 가득할 때 */
  const TOWN_TALK = {
  "village": {
    "shopBase": "마을의 유일한 상점. 이름을 표시하는 팻말에는 유려한 글씨로 이렇게 적혀 있다: 넛츠 프레젠트. \n가게 내부를 몇 번 증축한 듯 벽의 한쪽이 판자로 기워져 있고, 각종 초보 모험가에게 알맞을 법한 것들이 진열되어 있다.",
    "shopHello": "사냥개 한 마리가 당신에게 호기심을 품고 고개를 숙여 냄새를 맡는다. 개가 코를 들고 당신에게 다가서려 하면, 흰 손이 그것을 막는다.\n긴 귀에 머리카락을 걸친 느슨한 인상의 주인이 미소를 띠고 가볍게 인사한다.\n\n상인, 케르트 | 어서 와. 뭐 좀 살래?",
    "shopStory": "상인, 케르트 | 이곳은 늘 모험을 시작하려는 젊은 모험가들로 북적이지.\n상인, 케르트 | 덕분에 수도에 기생하는 꼴이었던 옛날의 모습을 완전히 벗어던지고, 이렇게나 많은 사람으로 붐비고 있어.\n\n케르트의 시선이 문의 바깥으로 향한다. 낯선 사람들이 바쁘게 걸어다니고, 갓 만든 음식 냄새가 부드럽게 풍겨 온다.\n\n상인, 케르트 | 가끔은 용이 불러온 재앙이 기쁜 일인지, 슬픈 일인지 잘 모르겠다는 생각도 들어. ...후후, 실언이었을까.",
    "shopAfter": "상인, 케르트 | 물건은 얼마든지 구경해도 좋아. 늘 네게 부담 없는 거래처가 되길 바라.",
    "innBase": "높은 음 여관. 수도 반대편에 있는 두 길의 사이에 이리로 오라는 듯 자리잡고 있다. \n여관 입구의 흙길로 얼마나 많은 사람이 오갔는지, 더없이 단단해 먼지조차 일지 않는다. \n낡은 마룻바닥에 여러 명의 발소리가 울리고, 그 안쪽으로부터는 갓 만든 음식의 냄새가 흘러나온다.",
    "innHello": "여관의 안쪽으로 들어서면, 주인이 바쁘게 장부를 쓰다가 당신을 보고 고개를 든다.\n\n여관 주인, 알토 | 어머, 정신 좀 봐! 어서오세요, 높은 음 여관이랍니다!",
    "innStory": "여관 주인, 알토 | 지난 여름에, 마을이 곰의 습격을 받았단다. 이 주변에서는 잘 발견되지 않는 아주 흉포하고 무서운 녀석이었지!\n여관 주인, 알토 | 평범한 마을이었다면 무너지고 말았을 텐데, 다행히 마을에 온 초보 모험가들이 열심히 힘을 써 주었어. 많이들 다치고 죽었지만 마을만은 무사했단다.\n\n문득 무언가 발코에 닿는다. 더러워진 성표가 주인을 잃고 발에 차여 여관 바닥을 구르고 있다.\n여관 주인, 알토 | 축복은 이미 끝났어. 새로운 모험가가 이 마을을 구하고 있을 뿐이지.",
    "innRest": "여관 주인, 알토 | ...괜찮니? 안색이 많이 나쁜 것 같은데.\n여관 주인, 알토 | 여기, 위층에 있는 방의 열쇠란다. 몸이 나아질 때까지는 무리하지 말고 쉬도록 하렴. 숙박비는 후불로 내도 괜찮으니까, 알았지?\n\n알토가 당신의 손에 나무로 만들어진 표식이 달린 열쇠를 하나 쥐여 준다. 생각보다 묵직하다.",

    "innFull": "알토가 당신을 슬픈 표정으로 보다가, 곧 입을 연다.\n\n여관 주인, 알토 | ...떠나는 것이 많이 무섭겠지. 가끔은 매정히 보내는 우리가 원망스러울지도 몰라. 그래도 이해해 다오.\n여관 주인, 알토 | 방이 많지 않아 장기투숙은 받지 않고 있단다. ...모험을 그만두고 싶다면, 다른 마을을 알아보렴."

  "snowtown": {

    "shopHello": "솥을 젓던 키가 작은 곱슬머리의 주인이 인기척에 깜짝 놀라 자리에서 펄쩍 뛰었다가, 주걱을 내려놓고 종종걸음으로 걸어 계산대의 앞에 선다.\n\n상인, 헬라 | 마, 많은 게 있진 않지만... 편하게 둘러보세요!",
    "shopStory": "헬라가 눈이 펑펑 내리는 바깥을 잠깐 보았다가, 상점의 문을 절반쯤 닫는다. 들어오는 냉기가 확 줄어드는 것이 피부로 느껴진다.\n\n상인, 헬라 | 그, 그거 아세요? 옛날에는 여기가... 이렇게 춥지는 않았대요. 용이 화가 난 뒤부터... 네, 어른들 말에 따르면요. 그래서 사람도 많이 줄었다고...\n상인, 헬라 | 무섭기도 해요... 하지만, 수도에서 지내려면, 너무 많은 돈이 필요해서...\n\n상인, 헬라 | ...다음에 모험가 님이 찾아오실 때까지, 우리 마을이 남아 있을까요? 집째로 얼음상이 되어 있지는 않을까요?",
    "shopAfter": "상인, 헬라 | 저, 혹시 괜찮다면, 물건을 구경하시는 동안... 솥을 좀, 저어도 될까요...?",
    "innBase": "지붕에 눈이 잔뜩 덮여 무슨 색인지 알기 어려운 오래되고 낡은 건물. 문 위에는 잘 꾸민 글자의 외곽을 따라 자른 나무 간판이 걸려 있다. '고요한 메아리 여관'.\n보온을 위해서인지 굳게 닫힌 문의 쇠 고리에는, 혹시나 장갑을 끼지 않은 이가 동상을 입지 않도록 천을 둘러 묶어 두었다.\n\n내부로 들어서자 새하얗고 파랗던 시야가 금빛으로 가득 찬다. 따스한 커피 향이 난다.",
    "innHello": "작은 키에 퉁명스러운 표정의 주인이 동물 가죽으로 표면을 덮은 의자에 앉아, 당신을 빤히 본다. \n\n무언가 의사표현을 하려고 하면 불만스런 투로 말을 끊는다.\n여관 주인, 이사야 | 그 전에, 문부터 닫아. 열이 다 나가잖아.",
    "innRest": "여관 주인, 이사야 | 쉬러 온 거지? 운이 좋네. 쓸 수 있는 방이 남았거든.\n여관 주인, 이사야 | 2층 복도 가운데에서 왼쪽에 있는 방을 써. 창문은 열지 마. 이불이 얼어 버리니까.\n\n이사야가 나무 열쇠 하나를 건넨다. 무척 튼튼하다.",
    "innStory": "여관 주인, 이사야 | 용이 인간을 적대하고, 동물이 흉포해지고, 마법 생물들이 깨어나 인간을 공격하거나 마을을 부수고...\n이사야가 읽고 있던 책의 페이지를 넘긴다. 그는 당신과 대화를 하면서도, 책에서 시선을 떼지 않는다.\n\n여관 주인, 이사야 | 난 그것들에 대응할 수 있다는 생각이 도저히 들지 않는데, 왜 매번 모험가라는 사람들은 꼭 상처투성이로 돌아오는지.\n여관 주인, 이사야 | 기어코 살아남아서, 다시 뛰쳐나가고... 그 생명력이 도무지 이해가 되질 않아.",
    "innAfter": "시간을 들여 다친 곳을 치료하고 휴식을 취했다. \n여관 키를 반납하고, 어느새 익숙해진 금빛 대신 희고 푸른 곳으로 걸음을 돌린다.",
    "innFull": "이사야가 실눈을 뜨고 당신의 상태를 어림한다.\n\n여관 주인, 이사야 | 어디가 아픈 것 같지는 않은데.\n여관 주인, 이사야 | 미안하지만, 돌아가. 간밤에 추위로 창문 몇 개가 깨지는 바람에 쓸 수 있는 방이 적거든."
  },
  "harbor": {}
};
  const heardStory = {};   // 상인 이야기를 들은 마을
  const heardInnStory = {}; // 여관 주인 이야기를 들은 마을

  /* ===== [24] 메뉴 화면 도우미: 머리(제목, 나가기) / 묶음 / 줄(이름·설명·가격 + 버튼) ===== */
  function openMenu(kind, title, sub) {
    screen = kind;
    $("choices").innerHTML = "";
    const m = el("div", "menu"), head = el("div", "menu-head"), t = el("div");
    t.appendChild(el("div", "menu-title", title));
    if (sub) t.appendChild(el("div", "menu-sub", sub));
    const close = el("button", "", "나가기");
    close.addEventListener("click", () => refresh());
    head.appendChild(t); head.appendChild(close); m.appendChild(head);
    $("choices").appendChild(m);
    return m;
  }
  /* 묶음: collapsible이면 눌러서 접고 펼 수 있음 */
  function menuSec(m, title, note, opts = {}) {
    const sec = el(opts.collapsible ? "details" : "div", "menu-sec");
    if (opts.collapsible && opts.open) sec.open = true;
    const h = el(opts.collapsible ? "summary" : "div", "sec-title");
    const left = el("span", "", title); if (note) { left.appendChild(document.createTextNode(" ")); left.appendChild(el("span", "note", note)); }
    h.appendChild(left);
    if (opts.action) { const b = el("button", "", opts.action.label); b.disabled = !!opts.action.disabled; b.addEventListener("click", e => { e.preventDefault(); opts.action.fn(); }); h.appendChild(b); }
    sec.appendChild(h); m.appendChild(sec);
    return sec;
  }
  /* 줄: o = { icon, name, desc, meta(HTML), btn, fn, disabled, badge, badgeOn, dim } */
  function menuRow(sec, o) {
    const r = el("div", "mrow" + (o.dim ? " dim" : "") + (o.icon ? "" : " noic"));
    const info = el("div", "mi");
    if (o.icon) info.appendChild(el("span", "ic", o.icon));
    const txt = el("div"); txt.appendChild(el("div", "mn", o.name)); if (o.desc) txt.appendChild(el("div", "md", o.desc));
    info.appendChild(txt); r.appendChild(info);
    const meta = el("div", "mm"); meta.innerHTML = o.meta || ""; r.appendChild(meta);
    if (o.badge) r.appendChild(el("span", "badge" + (o.badgeOn ? " on" : ""), o.badge));
    else { const b = el("button", "", o.btn); b.disabled = !!o.disabled; b.addEventListener("click", o.fn); r.appendChild(b); }
    sec.appendChild(r);
    return r;
  }
  const coin = n => `<span class="price">💰 ${n}</span>`;
  /* 상점에서 파는 도구·부적 설명 */
  const ITEM_INFO = { "낚싯대": "호수, 해변, 동굴, 오아시스에서 낚시할 때 필요", "곡괭이": "철광석과 유물 조각을 캘 때 필요",
    "행운의 부적": "모든 판정에 +1", "마법 주사위": "주사위를 하나 더 굴려 높은 눈을 씀", "수정 주사위": "주사위를 하나 더 굴려 높은 눈을 씀" };

  /* 상점: 마을마다 파는 물건과 가격, 재료 시세가 다릅니다 (shops 표는 [18]에 있음) */
  function showShop(msg) {
    const shop = shops[current];
    const tk = TOWN_TALK[current] || {};
    const hello = (heardStory[current] && tk.shopAfter) || tk.shopHello || `[상인 ${actions[current].npc.shop}] 어서 와요! 사고팔 게 있나요?`;
    setLoc(`${places[current].name} 상점`, tk.shopBase || places[current].text);
    if (msg) setStory(msg); else if (msg === undefined || (heardStory[current] && tk.shopAfter)) typeStory(hello); else setStory("");
    building = "shop";
    const m = openMenu("shop", `${places[current].name} 상점`, `가진 금화 ${gold}닢`);
    questSection(m, "shop");
    if (tk.shopStory) {          // 상인과 이야기하기
      const sec = menuSec(m, "대화");
      menuRow(sec, { icon: "💬", name: `${josa(actions[current].npc.shop, "과", "와")} 이야기하기`, desc: heardStory[current] ? "다시 듣기" : "",
        btn: "듣기", fn: () => { heardStory[current] = true; talkThenNext(tk.shopStory); } });
    }
    const wares = Object.entries(shop.wares);
    const weapons = wares.filter(([n]) => recipes[n]), goods = wares.filter(([n]) => !recipes[n]);
    if (weapons.length) {
      const sec = menuSec(m, "무기", "사면 바로 착용");
      for (const [n, price] of weapons) {
        const r = recipes[n], have = owned[n];
        menuRow(sec, { icon: WEAPON_TYPES[r.wtype].icon, name: n, desc: `${r.wtype}(${WEAPON_TYPES[r.wtype].stat}) · ${bonusText(r.bonus)}`,
          meta: coin(price), btn: "구매", fn: () => buy(n, price), disabled: gold < price,
          badge: have ? (equipped[r.slot] === n ? "착용 중" : "보유") : "", badgeOn: equipped[r.slot] === n });
      }
    }
    if (goods.length) {
      const sec = menuSec(m, "도구 · 부적");
      for (const [n, price] of goods)
        menuRow(sec, { icon: MAGIC_DICE[n] ? "🎲" : "🧰", name: n, desc: ITEM_INFO[n] || "", meta: coin(price),
          btn: "구매", fn: () => buy(n, price), disabled: gold < price, badge: bag[n] ? "보유" : "" });
    }
    const sellable = Object.keys(bag).filter(n => sellPrice[n] && bag[n] > 0);
    const total = sellable.reduce((t, n) => t + itemPrice(n) * bag[n], 0);
    const sec = menuSec(m, "재료 팔기", "▲ 비싸게 · ▼ 싸게 사 주는 재료",
      { action: sellable.length ? { label: `모두 팔기 💰${total}`, fn: sellAll } : null });
    if (!sellable.length) sec.appendChild(el("div", "menu-empty", "팔 재료가 없다. 시세: " + marketText()));
    for (const n of sellable) {
      const mult = (shops[current].sell || {})[n] || 1, arrow = mult > 1 ? " ▲" : mult < 1 ? " ▼" : "";
      menuRow(sec, { icon: "🌿", name: `${n} ×${bag[n]}`, meta: `${coin(itemPrice(n))}<span>개당${arrow}</span>`,
        btn: "팔기", fn: () => sellOne(n) });
    }
    updateStatus();
  }

  /* 재료 한 종류를 모두 팝니다 */
  function sellOne(n) {
    const got = itemPrice(n) * bag[n], cnt = bag[n];
    gold += got; delete bag[n];
    showShop(`${n} ${cnt}개를 팔아 금화 ${got}닢을 받았다.`);
  }

  function buy(name, price) {
    if (gold < price) return showShop("금화가 부족하다.");
    gold -= price;
    if (recipes[name]) {            // 장비: 바로 착용 (원래 끼던 것은 대장간에서 다시 바꿔 낄 수 있음)
      owned[name] = true; equipped[recipes[name].slot] = name;
      return showShop(`${josa(name, "을", "를")} 사서 바로 착용했다! 이제 공격에 ${josa(attackStat(), "을", "를")} 쓴다.`);
    }
    bag[name] = 1;
    showShop(`${josa(name, "을", "를")} 샀다!`);
  }

  /* 재료를 팝니다: 이 마을의 시세(itemPrice)로 계산 */
  function sellAll() {
    let total = 0;
    for (const n of Object.keys(bag)) if (sellPrice[n] && bag[n] > 0) { total += itemPrice(n) * bag[n]; delete bag[n]; }
    gold += total;
    showShop(`재료를 모두 팔아 금화 ${total}닢을 받았다.`);
  }

  /* ===== [13] 체력: 깎이는 함수, 쓰러짐, 마을에서 휴식 ===== */
  function hurt(n) { stamina = Math.max(0, stamina - n); }

  /* 체력이 0이 되면 의식을 잃고 마을에서 깨어납니다 (체력 5로 시작) */
  function faint() {
    stamina = 5; current = nearestTown(); // 가장 가까운 마을에서 깨어남
    setStory(`체력이 바닥나 의식을 잃었다... 가장 가까운 마을(${places[current].name})에서 눈을 떴다. (체력 5로 회복)`);
    $("choices").innerHTML = "";
    placeHero(current);
    addBtn("일어나기", () => refresh());
    updateStatus();
  }

  /* 마을에서 쉬면 체력이 가득 찹니다 */
  function rest() {
    if (stamina >= STAMINA_MAX) return say("몸이 가뿐하다. 지금은 쉴 필요가 없다.");
    stamina = STAMINA_MAX;
    say(""); typeStory(`[여관 주인 ${actions[current].npc.inn}] 푹 쉬다 가요.\n체력이 모두 회복되었다!`);
  }

  /* ===== [28] 건물 안: 상점·여관에 들어가 있는 동안의 대화와 의뢰 =====
     대화가 끝나면 [다음] 버튼만 남고, 누르면 곧바로 그 건물에 다시 들어온 것처럼 재입장 대사가 나옴 */
  let building = null;            // 지금 들어가 있는 건물: "shop" / "inn"
  function enterBuilding(msg) { msg = msg || null; if (building === "inn") showInn(msg); else showShop(msg); } // msg가 null이면 '다시 들어옴'
  function talkThenNext(text) {
    typeStory(text);
    $("choices").innerHTML = "";
    addBtn("다음", () => enterBuilding(), "", "act");
  }
  /* 의뢰를 주거나 받는 건물: 여관 주인은 여관, 상인은 상점 */
  function questBuilding(npc) { return npc.startsWith("여관") ? "inn" : "shop"; }
  function buildingName(b) { return b === "inn" ? "여관" : "상점"; }
  /* 이 장소의 이 건물에서 할 수 있는 의뢰 행동: "offer"(새 의뢰) / "report"(보고) / null */
  function questHere(b) {
    const q = curQuest(); if (!q) return null;
    if (quest.status === "offer" && q.giver === current && questBuilding(q.npc) === b) return "offer";
    if (quest.status === "active" && reportPlace(q) === current && questBuilding(q.reportNpc || q.npc) === b) return "report";
    return null;
  }
  /* 건물 메뉴 맨 위의 '의뢰' 묶음 */
  function questSection(m, b) {
    const k = questHere(b); if (!k) return;
    const q = curQuest(), sec = menuSec(m, "의뢰");
    if (k === "offer") menuRow(sec, { icon: "❗", name: `${josa(q.npc, "과", "와")} 이야기하기`, desc: "새 의뢰", btn: "듣기", fn: showQuestOffer });
    else menuRow(sec, { icon: "❓", name: `${q.reportNpc || q.npc}에게 보고하기`, desc: `의뢰: ${q.title}`, btn: "보고", fn: reportQuest });
  }

  /* 여관 화면: 여관 주인 인사 → 쉬기 (대사가 준비된 마을만) */
  function showInn(msg) {
    const tk = TOWN_TALK[current] || {};
    setLoc(`${places[current].name} 여관`, tk.innBase || places[current].text);
    if (msg) setStory(msg); else if (msg === undefined) typeStory(tk.innHello); else setStory("");
    building = "inn";
    const m = openMenu("inn", `${places[current].name} 여관`, `여관 주인 ${actions[current].npc.inn} · 체력 ${stamina}/${STAMINA_MAX}`);
    questSection(m, "inn");
    if (tk.innStory) {           // 여관 주인과 이야기하기
      const ts = menuSec(m, "대화");
      menuRow(ts, { icon: "💬", name: `${josa(actions[current].npc.inn, "과", "와")} 이야기하기`, desc: heardInnStory[current] ? "다시 듣기" : "",
        btn: "듣기", fn: () => { heardInnStory[current] = true; talkThenNext(tk.innStory); } });
    }
    const sec = menuSec(m, "숙박");
    menuRow(sec, { icon: "🛏", name: "방을 빌려 쉬기", desc: "체력을 모두 회복", btn: "쉬기", fn: innRest });
    updateStatus();
  }
  function innRest() {
    const tk = TOWN_TALK[current] || {};
    if (stamina >= STAMINA_MAX) { talkThenNext(tk.innFull || "몸이 가뿐하다. 지금은 쉴 필요가 없다."); return; }
    stamina = STAMINA_MAX;
    updateStatus();
    typeStory(tk.innRest || `[여관 주인 ${actions[current].npc.inn}] 푹 쉬다 가요.\n체력이 모두 회복되었다!`);
    $("choices").innerHTML = "";
    addBtn("푹 쉰다", () => { refresh(); if (tk.innAfter) typeStory(tk.innAfter); else setStory("체력이 모두 회복되었다!"); }, "", "act", `체력 ${STAMINA_MAX}/${STAMINA_MAX}`);
  }

  /* ===== [14] 도망 확인 팝업: 전투가 잠시 멈추고 예/아니오를 묻습니다 ===== */
  function askEscape() {
    const B = battle; if (!B) return;
    clearTimeout(B.timer); // 팝업이 떠 있는 동안 전투 정지
    $("escHint").textContent = `도망 판정: ${tierText(battleNeeds(B).escapeTier)} (민첩)`;
    $("modal").hidden = false;
    $("yes").disabled = $("no").disabled = false; // 팝업 버튼은 항상 눌릴 수 있게 함
    $("yes").onclick = () => { $("modal").hidden = true; tryEscape(); };
    $("no").onclick = () => { $("modal").hidden = true; if (battle) battle.timer = setTimeout(battleRound, 1500); };
    $("no").focus();
  }

  /* ===== [15] 이동 시간과 길의 위험도 ===== */
  /* 이동 시간 배율: 지금은 1 (이동 1/3/5초).
     실제 버전에서는 이 숫자만 키우면 모든 길의 시간이 한꺼번에 늘어납니다 (예: 6 → 6초/18초/30초). */
  const TRAVEL_TIME_SCALE = 1;

  /* 위험도 표: step=이동 시간 단계(1~5, TIME_STEPS의 초), encounter=이동 중 사건이 일어날 확률
     위험한 길은 지름길라서 빠르지만 사건이 잦고, 안전한 길은 돌아가서 느립니다. */
  const DANGER = {
    low:  { label: "안전", step: 5, encounter: 0.25 },
    mid:  { label: "보통", step: 3, encounter: 0.4 },
    high: { label: "위험", step: 1, encounter: 0.72 }
  };

  for (const d of Object.values(DANGER)) d.seconds = TIME_STEPS[d.step - 1]; // 시간 단계 → 초

  /* 길별 위험도: [5]의 roadList에서 자동으로 만듭니다 (두 장소 이름을 가나다순으로 정렬해 하이픈으로 잇는 방식) */
  const roadDanger = {};
  for (const [a, b, d] of roadList) roadDanger[[a, b].sort().join("-")] = d;

  /* 두 장소 사이 길의 위험도 정보를 돌려주는 함수 (적어 둔 게 없으면 보통) */
  function roadInfo(a, b) { return DANGER[roadDanger[[a, b].sort().join("-")] || "mid"]; }

  /* 초를 "1.5초", "2분 30초"처럼 보기 좋게 바꾸는 함수 (실제 버전의 긴 시간에 대비) */
  function fmtTime(sec) {
    if (sec < 60) return `${Math.round(sec * 10) / 10}초`;
    const m = Math.floor(sec / 60), s = Math.round(sec % 60);
    return s ? `${m}분 ${s}초` : `${m}분`;
  }

  /* ===== [16] 장비 제작과 착용 (대장간) ===== */
  /* 장비 레시피: slot=착용 칸, bonus=행동별 주사위 보정(공격/방어/도망, 마이너스도 가능), cost=필요한 재료("금화"는 돈) */
  /* 무기 분류: 분류마다 [공격] 판정에 쓰는 스탯이 다름 (무기가 없으면 맨손 = 근거리) */
  const WEAPON_TYPES = {
    "근거리":    { stat: "근력", icon: "🗡" },
    "원거리":    { stat: "민첩", icon: "🏹" },
    "마법 도구": { stat: "지력", icon: "🪄" },
    "사역마":    { stat: "정신", icon: "🐾" }
  };
  /* 장비 표: slot=착용 칸, wtype=무기 분류, tier=무기 단계(1 상점 / 2 의뢰 보상·제작 / 3 대장간 상위),
     bonus=올려 주는 스탯(음수면 내려감), cost=대장간 제작 재료, shop=true면 상점에서 사는 장비
     판정 보정은 스탯 ÷ 3 이라서, 스탯 +3마다 판정이 +1씩 오름 */
  const recipes = {
    // 1단계: 마을 상점
    "나무 몽둥이": { slot: "무기", wtype: "근거리",    tier: 1, bonus: { "근력": 3 }, shop: true },
    "경석궁":     { slot: "무기", wtype: "원거리",    tier: 1, bonus: { "민첩": 3 }, shop: true },
    "나무 지팡이": { slot: "무기", wtype: "마법 도구", tier: 1, bonus: { "지력": 3 }, shop: true },
    "사냥개":     { slot: "무기", wtype: "사역마",    tier: 1, bonus: { "정신": 3 }, shop: true },
    // 2단계: 항구 상인의 의뢰 보상 (지금 쓰는 무기 분류에 맞춰 지급), 대장간에서도 제작 가능
    "철검":       { slot: "무기", wtype: "근거리",    tier: 2, bonus: { "근력": 4, "정신": 2 }, cost: { "철광석": 2, "금화": 3 } },
    "사냥꾼의 활": { slot: "무기", wtype: "원거리",    tier: 2, bonus: { "민첩": 4, "감지": 2 }, cost: { "산딸기": 3, "철광석": 1, "금화": 3 } },
    "수정 지팡이": { slot: "무기", wtype: "마법 도구", tier: 2, bonus: { "지력": 4, "행운": 2 }, cost: { "독초": 2, "금화": 4 } },
    "훈련된 매":  { slot: "무기", wtype: "사역마",    tier: 2, bonus: { "정신": 4, "감지": 2 }, cost: { "회어": 3, "금화": 3 } },
    // 3단계: 대장간 상위 무기
    "강철검":     { slot: "무기", wtype: "근거리",    tier: 3, bonus: { "근력": 6, "정신": 3, "민첩": -2 }, cost: { "철광석": 5, "약초": 2, "금화": 10 } },
    "강철 장궁":  { slot: "무기", wtype: "원거리",    tier: 3, bonus: { "민첩": 6, "감지": 3 }, cost: { "철광석": 3, "회전초": 2, "금화": 10 } },
    "룬 지팡이":  { slot: "무기", wtype: "마법 도구", tier: 3, bonus: { "지력": 6, "행운": 3 }, cost: { "유물 조각": 2, "독초": 2, "금화": 10 } },
    "태엽 부엉이": { slot: "무기", wtype: "사역마",    tier: 3, bonus: { "정신": 6, "감지": 3 }, cost: { "철광석": 4, "금린어": 2, "금화": 10 } },
    // 방어구
    "약초 망토":  { slot: "방어구", bonus: { "정신": 2, "민첩": 2 }, cost: { "약초": 3, "버섯": 3 } },
    "철 갑옷":    { slot: "방어구", bonus: { "정신": 6, "민첩": -2 }, cost: { "철광석": 6, "회어": 3, "금화": 10 } }
  };
  const owned = {};                                   // 만들어 둔 장비
  const equipped = { "무기": null, "방어구": null }; // 칸마다 하나씩 착용

  /* 착용 중인 장비가 올려 주는 스탯 합계 */
  function gearStat(name) {
    return Object.values(equipped).reduce((sum, n) => sum + (n ? (recipes[n].bonus[name] || 0) : 0), 0);
  }
  /* 실제로 판정에 쓰는 스탯 = 기본 스탯 + 장비 */
  function effStat(name) { return stats[name] + gearStat(name); }
  /* 지금 무기 분류에 맞는 n단계 무기 이름 */
  function weaponFor(tier) {
    const w = equipped["무기"], type = w ? recipes[w].wtype : "근거리";
    return Object.keys(recipes).find(k => recipes[k].wtype === type && recipes[k].tier === tier);
  }
  function gearText() {
    const w = equipped["무기"], a = equipped["방어구"];
    const wt = w ? `${w}(${recipes[w].wtype}·${WEAPON_TYPES[recipes[w].wtype].stat})` : "맨손(근거리·근력)";
    const b = bonusText(totalBonus());
    return [wt, a].filter(Boolean).join(", ") + (b === "효과 없음" ? "" : ` / ${b}`);
  }
  /* 지금 무기로 공격할 때 쓰는 스탯 */
  function attackStat() { const w = equipped["무기"]; return WEAPON_TYPES[w ? recipes[w].wtype : "근거리"].stat; }
  /* 장비 설명: "무기 · 원거리(민첩) · 공격 +1, 도망 +1" */
  function gearDesc(r) { return `${r.slot}${r.wtype ? ` · ${r.wtype}(${WEAPON_TYPES[r.wtype].stat})` : ""} · ${bonusText(r.bonus)}`; }


  function sign(n) { return n > 0 ? `+${n}` : `${n}`; }
  /* 장비 효과를 "근력 +3, 민첩 -2"처럼 글로 바꿉니다 (0인 항목은 생략) */
  function bonusText(b) {
    const parts = STAT_NAMES.filter(k => b[k]).map(k => `${k} ${sign(b[k])}`);
    return parts.length ? parts.join(", ") : "효과 없음";
  }
  /* 착용 중인 장비 전체의 스탯별 합계 */
  function totalBonus() { const t = {}; for (const k of STAT_NAMES) t[k] = gearStat(k); return t; }

  function costText(cost) {
    return Object.entries(cost).map(([k, v]) => `${k} ${v}`).join(", ");
  }
  function canCraft(cost) {
    return Object.entries(cost).every(([k, v]) => k === "금화" ? gold >= v : (bag[k] || 0) >= v);
  }

  /* 대장간 화면: 제작 맡기기, 착용하기 */
  function showSmith(msg) {
    setLoc(`${places[current].name} 대장간`, places[current].text);
    if (msg) setStory(msg); else typeStory(`[대장장이 ${actions[current].npc.smith}] 재료를 가져오면 장비를 만들어 주지. 가지고 있는 장비는 여기서 바꿔 낄 수 있네.`);
    const m = openMenu("smith", "대장간", "제작 / 착용 · 지금 쓰는 무기 분류가 먼저 펼쳐져 있어요");
    const curType = equipped["무기"] ? recipes[equipped["무기"]].wtype : "근거리";
    const groups = [...Object.keys(WEAPON_TYPES).map(t => [t, `${WEAPON_TYPES[t].icon} ${t} 무기`, `${WEAPON_TYPES[t].stat}으로 공격`]), ["방어구", "🛡 방어구", ""]];
    for (const [key, title, note] of groups) {
      const items = Object.entries(recipes).filter(([, r]) => key === "방어구" ? r.slot === "방어구" : r.wtype === key)
        .sort((a, b) => (a[1].tier || 0) - (b[1].tier || 0));
      const sec = menuSec(m, title, note, { collapsible: true, open: key === curType || key === "방어구" });
      for (const [n, r] of items) {
        const on = equipped[r.slot] === n;
        const tier = r.tier ? `${r.tier}단계 · ` : "";
        const meta = owned[n] ? "" : r.cost
          ? Object.entries(r.cost).map(([k, v]) => { const have = k === "금화" ? gold : (bag[k] || 0);
              return `<span class="cost ${have >= v ? "ok" : "no"}">${k === "금화" ? "💰" : k} ${have}/${v}</span>`; }).join("")
          : `<span class="cost">상점에서 판매</span>`;
        const row = { icon: gearIcon(n), name: n, desc: tier + bonusText(r.bonus), meta };
        if (on) Object.assign(row, { badge: "착용 중", badgeOn: true });
        else if (owned[n]) Object.assign(row, { btn: "착용", fn: () => equip(n) });
        else if (r.cost) Object.assign(row, { btn: "제작", fn: () => craft(n), disabled: !canCraft(r.cost) });
        else Object.assign(row, { badge: "미보유", dim: true });
        menuRow(sec, row);
      }
    }
    updateStatus();
  }

  /* 제작: 재료와 금화를 내고 장비를 얻습니다 */
  function craft(name) {
    const r = recipes[name];
    if (!canCraft(r.cost)) return showSmith("재료가 부족하다.");
    for (const [k, v] of Object.entries(r.cost)) {
      if (k === "금화") gold -= v;
      else { bag[k] -= v; if (bag[k] <= 0) delete bag[k]; }
    }
    owned[name] = true;
    showSmith(`대장장이 ${actions[current].npc.smith}가 뚝딱뚝딱 두드리더니 ${josa(name, "을", "를")} 완성했다!`);
  }

  /* 착용: 같은 칸에 끼고 있던 장비는 자동으로 벗겨집니다 */
  function equip(name) {
    equipped[recipes[name].slot] = name;
    showSmith(`${josa(name, "을", "를")} 착용했다! 공격 스탯: ${attackStat()} / 장비 효과: ${bonusText(totalBonus())}`);
  }

  /* 쓰러졌을 때 깨어날 가장 가까운 마을 (마을 = 쉼 수 있는 장소) */
  function nearestTown() {
    const me = places[current];
    let best = "village", dist = Infinity;
    for (const id of Object.keys(places)) {
      if (!actions[id] || !actions[id].rest) continue;
      const d = Math.hypot(places[id].x - me.x, places[id].y - me.y);
      if (d < dist) { dist = d; best = id; }
    }
    return best;
  }

  /* ===== [17] 캐릭터 스탯 7종: 근력, 정신, 민첩, 재주, 지력, 감지, 행운 ===== */
  const STAT_NAMES = ["근력", "정신", "민첩", "재주", "지력", "감지", "행운"];
  const stats = { "근력": 6, "정신": 6, "민첩": 6, "재주": 6, "지력": 6, "감지": 6, "행운": 6 }; // 기본치 6 (캐릭터 만들기에서 16점을 나눔)
  const STAT_MAX = 15;            // 훈련장에서 올릴 수 있는 최대치
  const MAKER_BASE = 6, MAKER_POINTS = 16, MAKER_MAX = 13; // 캐릭터 만들기: 기본치, 나눌 점수, 만들 때의 상한

  /* 스탯별 효과 (훈련장 화면에도 표시됨) */
  const STAT_INFO = {
    "근력": "근거리 무기(맨손 포함) 공격, 광석 캐기, 버티기",
    "정신": "방어 판정, 사역마 공격, 무시하기·그냥 두기 같은 선택",
    "민첩": "원거리 무기 공격, 도망 판정, 몸을 쓰는 회피",
    "재주": "낚시·약초·열매·버섯·사막 채집, 상자 열기",
    "지력": "마법 도구 공격, 재료 판매가 +10%/단계(9부터), 길 안내·거래 판단",
    "감지": "숨겨진 보물 찾기, 이동 중 사건 확률 -2%p/단계(9부터)",
    "행운": "모든 판정에서 주사위를 한 번 더 굴려 높은 눈을 쓸 확률 (행운 6이면 9%, 1점당 +3%)"
  };

  /* 스탯 보정: 6~8이면 +2(시작 값), 9~11이면 +3, 12~14이면 +4, 15이면 +5 (3점마다 +1) */
  function statBonus(name) { return Math.floor(effStat(name) / 3); } // 장비로 오른 스탯 포함

  /* 프로필의 판정 보정: 근력 +n 정신 +n 민첩 +n / 감지 +n 재주 +n 지력 +n 행운 +n (장비로 오른 칸은 파란 글씨) */
  function renderStats() {
    const box = $("stats"); box.innerHTML = "";
    BONUS_ORDER.forEach((row, ri) => row.forEach(n => {
      const b = statBonus(n), g = gearStat(n);
      const t = el("div", "bn" + (ri ? " r2" : "") + (g ? " gear" : ""), n);
      t.appendChild(el("b", "", sign(b)));
      t.title = `${n} ${effStat(n)}${g ? ` (기본 ${stats[n]}, 장비 ${sign(g)})` : ""} · 판정 ${sign(b)}\n${STAT_INFO[n]}`; // 마우스를 올리거나 길게 누르면 자세히
      box.appendChild(t);
    }));
  }

  /* 훈련장: 금화를 내고 스탯을 1 올립니다 (비용 = 현재 값 x 2) */
  function showTraining(msg) {
    setLoc(`${places[current].name} 훈련장`, places[current].text);
    if (msg) setStory(msg); else typeStory("[교관] 금화를 내면 단련을 도와주지. 기본 스탯이 1씩 오른다네.");
    const m = openMenu("train", "훈련장", `기본 스탯 최대 ${STAT_MAX} (장비 제외) · 가진 금화 ${gold}닢`);
    const sec = menuSec(m, "스탯 단련", "판정 보정은 (장비 포함 스탯 ÷ 3)");
    for (const n of STAT_NAMES) {
      const v = stats[n], cost = v * 2, eff = effStat(n), g = gearStat(n);
      const up = Math.floor((eff + 1) / 3) > Math.floor(eff / 3);
      const meta = v >= STAT_MAX ? "" :
        `<span>${v} → ${v + 1}${g ? ` (장비 포함 ${eff} → ${eff + 1})` : ""}</span>${up ? `<span class="up">판정 +1 ↑</span>` : ""}${coin(cost)}`;
      const row = { name: `${n} ${v}`, desc: STAT_INFO[n], meta };
      if (v >= STAT_MAX) Object.assign(row, { badge: "최대" });
      else Object.assign(row, { btn: "단련", fn: () => train(n), disabled: gold < cost });
      menuRow(sec, row);
    }
    updateStatus();
  }

  function train(n) {
    const cost = stats[n] * 2;
    if (gold < cost) return showTraining("금화가 부족하다.");
    gold -= cost; stats[n]++;
    showTraining(`${josa(n, "을", "를")} 단련했다! (${stats[n]})`);
  }

  /* ===== [18] 마을별 상점: 파는 물건과 가격, 재료 시세 =====
     wares : 이 마을에서 파는 물건과 가격 (없는 물건은 이 마을에서 살 수 없음)
     sell  : 재료별 시세 배율 (1보다 크면 비싸게 사 주고, 작으면 싸게 사 줌. 적지 않은 재료는 1) */
  const shops = {
    village:  { wares: { "나무 몽둥이": 4, "경석궁": 5, "나무 지팡이": 5, "사냥개": 5, "낚싯대": 6, "곡괭이": 8, "행운의 부적": 10 },
                sell: {} },
    harbor:   { wares: { "낚싯대": 5, "곡괭이": 12, "행운의 부적": 14, "마법 주사위": 45 },
                sell: { "회어": 1.5, "금린어": 1.5, "철광석": 0.8, "약초": 0.9 } },
    snowtown: { wares: { "곡괭이": 7, "행운의 부적": 9, "마법 주사위": 40, "수정 주사위": 130 },
                sell: { "철광석": 1.3, "약초": 1.2, "독초": 1.3, "유물 조각": 1.2, "회어": 0.7, "금린어": 0.8 } }
  };

  /* 이 마을에서 재료 하나를 팔 때 받는 금화: 기본 가격 x 마을 시세 x 지력 보정 */
  function itemPrice(n) {
    const mult = (shops[current].sell || {})[n] || 1;
    return Math.max(1, Math.round(sellPrice[n] * mult * (1 + 0.1 * (statBonus("지력") - 2))));
  }
  /* 상점 화면에 보여줄 재료 시세 글 */
  function marketText() {
    return Object.keys(sellPrice).map(n => {
      const m = (shops[current].sell || {})[n] || 1;
      return `${n} ${itemPrice(n)}${m > 1 ? "▲" : m < 1 ? "▼" : ""}`;
    }).join(" / ");
  }

  /* ===== [19] 모바일: 좁은 화면에서 지도 안의 캐릭터 위치가 화면 가운데 오도록 지도를 좌우로 스크롤합니다 ===== */
  function followHero(x) {
    const wrap = $("mapwrap"), svg = $("map");
    const k = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;   // 지도 확대/축소 비율
    wrap.scrollTo({ left: Math.max(0, (x - svg.viewBox.baseVal.x) * k - wrap.clientWidth / 2), behavior: "smooth" });
  }

      reward: { gold: 30, item: "마법 주사위" } }
  ];
  const quest = { i: 0, status: "offer", n: 0 }; // i: 지금 의뢰 번호, status: offer(말을 걸면 받음) / active(진행 중) / over(모두 끝), n: 처치 수

  /* 한국어 조사 고르기: 마지막 글자에 받침이 있으면 withB, 없으면 without (예: 여관 주인 + 과/와 → 여관 주인과) */
  function hasBatchim(w) { const c = w.charCodeAt(w.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0; }
  function josa(w, withB, without) { return w + (hasBatchim(w) ? withB : without); }

  function curQuest() { return quest.status === "over" ? null : quests[quest.i]; }
  function reportPlace(q) { return q.type === "deliver" ? q.to : q.giver; }  // 완료 보고를 하는 장소
  function questGoal(q) {
    if (q.type === "deliver") return `${q.reportNpc}에게 ${q.give} 전달`;
    if (q.type === "kill") return `${q.target || "몬스터"} ${q.count}마리 처치`;
    if (q.type === "buy") return "상점에서 무기 1종 구매";
    return `${q.item} ${q.count}개 모으기`;
  }
  function questProgress(q) {
    if (q.type === "deliver") return [0, 1];
    if (q.type === "kill") return [Math.min(quest.n, q.count), q.count];
    if (q.type === "buy") return [Object.keys(owned).some(n => recipes[n].shop && recipes[n].slot === "무기") ? 1 : 0, 1];
    return [Math.min(bag[q.item] || 0, q.count), q.count];
  }
  function questDone(q) {
    if (q.type === "deliver") return current === q.to;
    const [a, b] = questProgress(q); return a >= b;
  }
  function rewardText(r) {
    return [r.gold ? `금화 ${r.gold}닢` : "", r.item || (r.weaponTier ? `${weaponFor(r.weaponTier)} (지금 쓰는 무기 분류의 ${r.weaponTier}단계 무기)` : "")].filter(Boolean).join(", ");
  }

  /* 화면 위쪽의 의뢰 안내 줄: 다음에 무엇을 해야 하는지 알려 줍니다 */
  /* 지도 위 의뢰 표시: 받을 수 있는 의뢰는 의뢰인이 있는 곳에 !, 완료할 수 있으면 보고하는 곳에 ? */
  function renderMarks() {
    const g = $("marks"); if (!g) return;
    g.innerHTML = "";
    const q = curQuest(); if (!q) return;
    let id = null, ch = "";
    if (quest.status === "offer") { id = q.giver; ch = "!"; }
    else if (quest.status === "active" && (q.type === "deliver" || questDone(q))) { id = reportPlace(q); ch = "?"; } // 배달은 도착하면 바로 완료
    if (!id) return;
    const p = places[id];
    g.innerHTML = `<g class="mark ${ch === "!" ? "offer" : "ready"}" transform="translate(${p.x} ${p.y - R - 46})">` +
      `<g class="mk"><circle r="28"></circle><text y="14">${ch}</text></g></g>`;
  }

  function renderQuest() {
    if ($("places").childElementCount) updateFog();
    renderMarks();
    const q = curQuest(), box = $("quest");
    box.innerHTML = "";
    const now = el("div", "q-now");
    if (!q) now.textContent = "모든 의뢰를 마쳤다. 섬을 자유롭게 탐험해 보자!";
    else if (quest.status === "offer") {
      now.appendChild(el("div", "q-title", "새 의뢰"));
      now.appendChild(el("div", "", `${josa(q.npc, "과", "와")} 이야기해 보자.`));
      now.appendChild(el("div", "", `📍 ${places[q.giver].name} ${buildingName(questBuilding(q.npc))}`));
    } else {
      const [a, b] = questProgress(q), ready = q.type !== "deliver" && questDone(q);
      now.appendChild(el("div", "q-title", q.title));
      now.appendChild(el("div", "", questGoal(q) + (q.type === "deliver" ? "" : ` (${a}/${b})`)));
      if (q.type !== "deliver") { const bar = el("div", "q-bar"), f = el("span"); f.style.width = (a / b * 100) + "%"; bar.appendChild(f); now.appendChild(bar); }
      now.appendChild(el("div", "", `보고: ${places[reportPlace(q)].name} · ${q.reportNpc || q.npc}`));
      now.appendChild(el("div", "", `보상: ${rewardText(q.reward)}`));
      if (ready) now.appendChild(el("div", "q-ready", "✔ 목표 달성! 보고하러 가자"));
    }
    box.appendChild(now);
    const done = quests.slice(0, quest.status === "over" ? quests.length : quest.i);
    if (done.length) {
      box.appendChild(el("div", "q-done-title", `완료한 의뢰 ${done.length}/${quests.length}`));
      const ul = el("ul", "q-done");
      for (const d of done) ul.appendChild(el("li", "", d.title));
      box.appendChild(ul);
    }
  }

  /* 이 장소에서 할 수 있는 의뢰 행동 버튼 (addActionButtons에서 호출) */
  function questButtons() {   // 건물 화면이 없는 곳(대사가 아직 없는 여관)에서만 장소 화면에 의뢰 버튼을 둠
    const q = curQuest(); if (!q) return;
    const noInnScreen = b => b === "inn" && !(TOWN_TALK[current] || {}).innHello;
    if (quest.status === "offer" && q.giver === current && noInnScreen(questBuilding(q.npc))) addBtn(`${josa(q.npc, "과", "와")} 이야기하기`, showQuestOffer, "", "act", "새 의뢰");
    if (quest.status === "active" && reportPlace(q) === current && noInnScreen(questBuilding(q.reportNpc || q.npc))) addBtn(`${q.reportNpc || q.npc}에게 보고하기`, reportQuest, "", "act", `의뢰: ${q.title}`);
  }

  function showQuestOffer() {
    const q = curQuest(); if (!q) return;
    typeStory(`${npcLine(q.npc, q.intro)}\n\n의뢰: ${q.title}\n목표: ${questGoal(q)}\n보상: ${rewardText(q.reward)}`);
    $("choices").innerHTML = "";
    addBtn("의뢰를 받는다", acceptQuest, "", "act");
    addBtn("나중에", () => backFromQuest(), "", "act");
  }
  /* 의뢰 대화가 끝나면 그 건물로 돌아감 (건물 화면이 없으면 장소로) */
  function backFromQuest(msg) {
    if (screen === "shop" || screen === "inn") return enterBuilding(msg);
    if (msg) say(msg); else refresh();
  }

  function acceptQuest() {
    const q = curQuest(); quest.status = "active"; quest.n = 0;
    if (q.give) bag[q.give] = 1;
    backFromQuest(`의뢰를 받았다! 목표: ${questGoal(q)}` + (q.give ? `\n(${josa(q.give, "을", "를")} 받았다)` : ""));
  }

  function reportQuest() {
    const q = curQuest(); if (!q) return;
    if (!questDone(q)) {
      const [a, b] = questProgress(q), text = `${npcLine(q.reportNpc || q.npc, q.hint || "아직이오.")}\n(진행: ${a}/${b})`;
      if (screen === "shop" || screen === "inn") return talkThenNext(text);
      say(""); typeStory(text); return;
    }
    // 완료: 낸 물건을 거두고 보상을 줌
    if (q.type === "deliver") delete bag[q.give];
    if (q.type === "gather") { bag[q.item] -= q.count; if (bag[q.item] <= 0) delete bag[q.item]; }
    let extra = "";
    gold += q.reward.gold || 0;
    const it = q.reward.weaponTier ? weaponFor(q.reward.weaponTier) : q.reward.item;
    if (it && recipes[it]) {            // 장비 보상: 바로 가지게 되고, 칸이 비었거나 같은 분류의 낮은 단계를 끼고 있으면 자동으로 착용
      const cur = equipped[recipes[it].slot], r = recipes[it];
      const better = !cur || (r.wtype && recipes[cur].wtype === r.wtype && (recipes[cur].tier || 0) < r.tier);
      if (owned[it]) { gold += 5; extra = ` (이미 ${josa(it, "이", "가")} 있어 금화 5닢으로 대신 받았다)`; }
      else { owned[it] = true;
             if (better) { equipped[r.slot] = it; extra = ` (${josa(it, "을", "를")} 착용했다: ${bonusText(r.bonus)})`; }
             else extra = ` (대장간에서 착용할 수 있다)`; }
    } else if (it) { if (bag[it]) { gold += 5; extra = ` (이미 ${josa(it, "이", "가")} 있어 금화 5닢으로 대신 받았다)`; } else bag[it] = 1; }
    quest.i++; quest.n = 0; quest.status = quest.i >= quests.length ? "over" : "offer";
    const doneText = it ? q.done.replace("{item을}", josa(it, "을", "를")) : q.done;
    typeStory(`${npcLine(q.reportNpc || q.npc, doneText)}\n\n의뢰 완료: ${q.title}\n보상: ${[q.reward.gold ? `금화 ${q.reward.gold}닢` : "", it].filter(Boolean).join(", ")}${extra}`);
    $("choices").innerHTML = "";
    const next = curQuest();
    if (next && next.giver === current && (questBuilding(next.npc) === building || !(screen === "shop" || screen === "inn"))) {
      addBtn("이야기 계속 듣기", showQuestOffer, "", "act", `${next.npc}의 새 의뢰`); addBtn("나중에", () => backFromQuest(), "", "act");
    } else addBtn("다음", () => backFromQuest(), "", "act");
    updateStatus();
  }

  /* 몬스터를 쓰러뜨릴 때마다 호출: 진행 중인 처치 의뢰의 수를 올립니다 */
  function questKill(name) {
    const q = curQuest();
    if (q && quest.status === "active" && q.type === "kill" && (!q.target || q.target === name)) quest.n++;
  }

  /* 데이터의 tier(난이도 단계)를 목표 달성치(need)로 바꿔 둡니다 */
  for (const e of encounters) for (const c of e.choices || []) c.need = DIFF[c.tier - 1];
  for (const a of Object.values(actions)) {
    for (const g of a.gather || []) g.need = DIFF[g.tier - 1];
    for (const k of ["hidden", "secret"]) if (a[k]) a[k].need = DIFF[a[k].tier - 1];
  }
  for (const m of Object.values(monsters)) if (m.gimmick) m.gimmick.need = DIFF[m.gimmick.tier - 1];

  /* ===== [22] 캐릭터 만들기: 기본치 6에서 16점을 나눔 (만들 때 상한 13) ===== */
  const MAKER_TEXT = "당신이 어떤 축복을 안고 태어났는지 고하라.\n\n총 16점을 자유롭게 분배한다. 메이킹 시점 스탯의 하한은 6, 상한은 13이다.";   // 엑셀 '스크립트_공통' 캐릭터 만들기 안내
  const START_TEXT = "제국의 수도 인근에 있는 작은 마을. \n수도와 인접한 덕에 재앙이 일어나기 시작한 당시 발빠르게 축복을 받았고, 덕분에 강한 몬스터가 상대적으로 적다고 한다. \n그만큼 축복의 영향력을 벗어난 구역에는 손쓸 수 없이 강한 것들도 있는 모양이지만.\n어쨌든, 모험을 시작하기에 알맞은 곳이다.\n\n당신의 부모, 보호자, 혹은 지난 동료나 선배 모험가는 이렇게 말했을 것이다─그 마을에 도착하면, 여관에 먼저 가 보라고.";   // 엑셀 '스크립트_공통' 게임 시작 (장소 설명 칸에 타자로)
  function pointsLeft() { return MAKER_POINTS - STAT_NAMES.reduce((t, n) => t + stats[n] - MAKER_BASE, 0); }

  function renderMaker() {
    const left = pointsLeft(), box = $("mkRows");
    $("mkLeft").textContent = left;
    $("mkLeft").parentNode.classList.toggle("done", left === 0);
    box.innerHTML = "";
    for (const n of STAT_NAMES) {
      const row = document.createElement("div"); row.className = "mk-row";
      const b = statBonus(n);
      row.innerHTML = `<div class="mk-name">${n}<span class="mk-info">${STAT_INFO[n]}</span></div>` +
        `<button aria-label="${n} 내리기">−</button>` +
        `<div class="mk-val">${stats[n]}<small>${b ? "판정 " + sign(b) : ""}</small></div>` +
        `<button aria-label="${n} 올리기">+</button>`;
      const [minus, plus] = row.querySelectorAll("button");
      minus.disabled = stats[n] <= MAKER_BASE;
      plus.disabled = stats[n] >= MAKER_MAX || left <= 0;
      minus.addEventListener("click", () => { stats[n]--; renderMaker(); });
      plus.addEventListener("click", () => { stats[n]++; renderMaker(); });
      box.appendChild(row);
    }
    $("mkStart").disabled = left !== 0;
    $("mkHint").textContent = left > 0 ? `점수를 모두 나눠야 시작할 수 있어. (${left}점 남음)` :
      "준비 완료! 판정 보정은 6~8이 +2, 9~11이 +3, 12~13이 +4야.";
  }

  function makerReset() { for (const n of STAT_NAMES) stats[n] = MAKER_BASE; renderMaker(); }
  function makerRandom() {
    makerReset();
    let left = MAKER_POINTS;
    while (left > 0) { const n = pick(STAT_NAMES); if (stats[n] < MAKER_MAX) { stats[n]++; left--; } }
    renderMaker();
  }

  /* ===== [9] 시작: 캐릭터를 다 만들면 지도를 그리고, 캐릭터를 마을에 놓고, 첫 화면을 보여줍니다 ===== */
  function startGame() {
    if (pointsLeft() !== 0) return;
    $("maker").hidden = true;
    $("game").hidden = false;
    drawMap();
    placeHero(current);
    heroName = ($("mkName").value || "").trim() || "모험가";
    refresh();
    // 게임 시작 문장: 마지막 문단(부모·보호자의 말)은 이야기 칸으로, 나머지는 장소 설명 칸으로
    const cut = START_TEXT.lastIndexOf("\n\n");
    setLoc(places[current].name, cut < 0 ? START_TEXT : START_TEXT.slice(0, cut).trimEnd(), true);
    if (cut >= 0) typeStory(START_TEXT.slice(cut + 2));
    window.scrollTo(0, 0);
  }

  $("storyCard").addEventListener("click", () => { stopIn(loc, true); stopIn(sto, true); revealAllChoices(); }); // 타자 중에 클릭하면 바로 전부 나옴
  $("locCard").addEventListener("click", () => stopIn(loc, true));
  $("mkLead").textContent = MAKER_TEXT;
  if (PORTRAIT_URL) $("portrait").innerHTML = `<img src="${PORTRAIT_URL}" alt="초상화">`;
  /* ===== [32] 배경음악: bgm.mp3를 처음 화면을 누르는 순간부터 끊김 없이 반복 재생 =====
     브라우저는 사용자가 한 번 누르기 전에는 소리를 낼 수 없어서, 첫 클릭(또는 터치)에 시작합니다.
     Web Audio로 곡 전체를 불러와 이음매 없이 반복하고, 안 되는 환경에서는 <audio>의 반복 재생을 씁니다. */
  const BGM_FILE = "bgm.mp3", BGM_VOLUME = 0.45;
  const bgm = { on: true, started: false, ctx: null, gain: null, src: null, el: null };
  const bgmData = fetch(BGM_FILE).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).catch(() => null);
  function bgmFallback() {
    if (bgm.el) return;
    bgm.el = new Audio(BGM_FILE); bgm.el.loop = true; bgm.el.volume = BGM_VOLUME;
    if (bgm.on) bgm.el.play().catch(() => {});
  }
  function startBgm() {
    if (bgm.started) return;
    bgm.started = true; bgm.startedAt = Date.now();
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return bgmFallback();
    try {
      bgm.ctx = new AC();
      bgm.gain = bgm.ctx.createGain(); bgm.gain.gain.value = 0; bgm.gain.connect(bgm.ctx.destination);
      bgm.ctx.resume();
    } catch (e) { return bgmFallback(); }
    bgmData.then(data => {
      if (!data) return bgmFallback();
      return bgm.ctx.decodeAudioData(data).then(buf => {
        bgm.src = bgm.ctx.createBufferSource();
        bgm.src.buffer = buf; bgm.src.loop = true;          // 곡이 끝나면 틈 없이 처음으로
        bgm.src.connect(bgm.gain); bgm.src.start();
        const t = bgm.ctx.currentTime;                      // 2초 동안 서서히 커짐
        bgm.gain.gain.setValueAtTime(0, t); bgm.gain.gain.linearRampToValueAtTime(bgm.on ? BGM_VOLUME : 0, t + 2);
      });
    }).catch(bgmFallback);
  }
  function setBgm(on) {
    bgm.on = on;
    const b = $("bgmBtn"); b.textContent = on ? "🔊" : "🔇"; b.classList.toggle("off", !on);
    b.title = b.ariaLabel = on ? "배경음악 끄기" : "배경음악 켜기";
    if (bgm.gain) { const t = bgm.ctx.currentTime; bgm.gain.gain.cancelScheduledValues(t); bgm.gain.gain.setTargetAtTime(on ? BGM_VOLUME : 0, t, 0.15); if (on) bgm.ctx.resume(); }
    if (bgm.el) { if (on) bgm.el.play().catch(() => {}); else bgm.el.pause(); }
  }
  ["pointerdown", "keydown", "touchend"].forEach(ev => document.addEventListener(ev, startBgm, { once: false, capture: true }));
  $("bgmBtn").addEventListener("click", () => { if (!bgm.started || Date.now() - bgm.startedAt < 600) { startBgm(); return; } setBgm(!bgm.on); }); // 첫 클릭은 음악 시작만
  // 탭을 다시 열었을 때 멈춰 있으면 다시 재생
  document.addEventListener("visibilitychange", () => { if (!document.hidden && bgm.on && bgm.ctx && bgm.ctx.state !== "running") bgm.ctx.resume(); });

  $("mkReset").addEventListener("click", makerReset);
  $("mkRandom").addEventListener("click", makerRandom);
  $("mkStart").addEventListener("click", startGame);
  renderMaker();
</script>
</body>
</html>
