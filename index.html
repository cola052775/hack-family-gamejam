<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작은 섬 탐험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <!-- ===== 캐릭터 만들기: 게임 시작 전에 이름을 정하고 스탯을 나눕니다 ===== -->
  <section id="maker" class="card" aria-label="캐릭터 만들기">
    <h1>작은 섬 탐험</h1>
    <div class="cap">캐릭터 만들기</div>
    <p class="mk-lead" id="mkLead"></p>
    <label class="mk-namerow">이름 <input id="mkName" maxlength="12" value="모험가" autocomplete="off"></label>
    <div class="mk-left">남은 점수 <b id="mkLeft"></b> / 16</div>
    <div id="mkRows"></div>
    <div class="mk-btns">
      <button id="mkReset">초기화</button>
      <button id="mkRandom">무작위로 나누기</button>
      <button id="mkStart" class="mk-go">모험 시작</button>
    </div>
    <p id="mkHint" class="mk-hint"></p>
  </section>

  <div id="game" hidden>
    <!-- 왼쪽(핸드폰은 위쪽): 지도 → 지금 있는 곳 이름 → 장소 설명 → 선택지 | 이야기 -->
    <div id="left">
      <!-- ===== [4] 지도 그림 자리: 장소와 길은 아래 JavaScript가 그려 넣습니다 ===== -->
      <div id="mapwrap">
      <svg id="map" viewBox="40 30 1820 1340" role="img" aria-label="섬 지도">
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" orient="auto"><path d="M0,0 L10,5 L0,10 z"></path></marker></defs>
        <g id="roads"></g>
        <g id="places"></g>
        <g id="marks"></g>
        <g id="hero"><rect x="-22" y="-22" width="44" height="44" rx="6"></rect></g>
      </svg>
      </div>

      <h2 id="locName"></h2>
      <!-- 장소 설명: 도착했을 때의 묘사, 상점·여관에 들어가면 그 건물의 기본 묘사 -->
      <section id="locCard" class="card loc-card" aria-label="장소 설명"><p id="locText"></p></section>

      <div class="play">
        <section class="card choice-card" aria-label="선택지"><div class="cap">선택지</div><div id="choices"></div></section>
        <!-- 이야기 칸: 선택지 결과, NPC 대화, 전투 기록 + 판정 주사위 -->
        <section id="storyCard" class="card story-card" aria-label="이야기" title="">
          <div class="cap">이야기</div>
          <p id="story" aria-live="polite"></p>
          <div id="diceBox" class="dicebox" aria-label="판정 주사위">
            <span class="dlabel">판정 주사위<br><b id="diceText">1D20</b></span>
            <span id="diceFace" class="dface">–</span><span id="diceMod" class="dmod"></span><span id="diceTot" class="dtot"></span>
          </div>
        </section>
      </div>
    </div>

    <!-- 오른쪽(핸드폰은 아래쪽): 프로필, 인벤, 의뢰 -->
    <aside id="side">
      <section id="profile" class="card" aria-label="프로필">
        <div id="portrait" class="portrait"><span>초상화</span></div>
        <div>
          <div class="pname"><b id="heroName"></b><span class="lv">Lv. <b id="lvText"></b></span></div>
          <div class="meter" title="체력"><span class="k">체력</span><span class="meter-bar"><span id="hpBar"></span></span><b id="hpText"></b></div>
          <div class="meter" title="마력 (아직 쓰이는 곳이 없음)"><span class="k">마력</span><span class="meter-bar"><span id="mpBar"></span></span><b id="mpText"></b></div>
        </div>
        <div id="stats" class="bonus-grid"></div>
      </section>
      <section id="invCard" class="card" aria-label="인벤">
        <div class="inv-head"><span class="cap">인벤</span><span class="gold" title="금화">💰 <b id="goldText"></b></span></div>
        <div class="inv-body">
          <div id="doll" class="doll"></div>
          <div class="bagwrap"><div id="invTabs" class="inv-tabs"></div><div id="bagGrid" class="bag-grid"></div></div>
        </div>
        <div id="atkText" class="atk"></div>
        <div id="bagInfo" class="bag-info"></div>
      </section>
      <section id="questCard" class="card" aria-label="의뢰"><div class="cap">의뢰</div><div id="quest"></div></section>
    </aside>
  </div>
</main>

<button id="bgmBtn" title="배경음악 끄기" aria-label="배경음악 끄기">🔊</button>

<!-- 도망 확인 팝업: 평소에는 숨겨져 있다가 [도망친다]를 누르면 나타납니다 -->
<div id="modal" hidden>
  <div class="box" role="dialog" aria-modal="true">
    <p>정말 도망치시겠습니까?</p>
    <p id="escHint"></p>
    <div class="row"><button id="yes">예</button><button id="no">아니오</button></div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
