<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작은 섬 탐험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&display=swap" rel="stylesheet">
<style>
  /* ===== [1] 색깔 모음: 여기 값만 바꿔도 게임 분위기가 바뀝니다 (다크 판타지: 검정·회색·양피지·갈색) ===== */
  :root {
    color-scheme: dark;
    --bg: #0e0c0a;      /* 페이지 배경 (거의 검정) */
    --card: #1b1814;    /* 카드 배경 (어두운 회갈색) */
    --paper: #221c15;   /* 장소 설명·이야기 칸 (그을린 양피지) */
    --tile: #2a251e;    /* 작은 칸 배경 */
    --line: #3d352b;    /* 테두리 */
    --edge: #7a6448;    /* 버튼 테두리 (갈색) */
    --hover: #352d23;   /* 버튼에 마우스를 올렸을 때 */
    --ink: #dccbaa;     /* 글자 색 (양피지색) */
    --hero: #b3382a;    /* 네모 캐릭터 색 (핏빛) */
    --btn: #241f19;     /* 버튼 배경 */
    --mv: #c9a45c;      /* 이동 묶음 (황토) */
    --ac: #a39a7a;      /* 행동 묶음·성공 (바랜 회황색) */
    --rl: #b0693a;      /* 도전 묶음 (녹슨 갈색) */
    /* 지도: 낡은 양피지 위에 갈색 잉크 */
    --sea: #b9a47a;     /* 지도 바탕 (양피지) */
    --land: #d8c69e;    /* 장소 동그라미 */
    --town: #8a5a2e;    /* 마을 동그라미 (갈색) */
    --map-ink: #2b2015; /* 지도 선과 글자 */
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  body { margin: 0; background: var(--bg); color: var(--ink);
         background-image: radial-gradient(ellipse at top, #1d1813 0%, var(--bg) 60%);
         font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  /* 제목·장소 설명·이야기는 명조체로 */
  /* 화면용으로 획이 굵은 본명조(Noto Serif KR)를 씀: 본문 500, 제목 700 */
  h1, #locName, #locText, #story, .menu-title, .q-title, .pname b { font-family: "Noto Serif KR", "Batang", serif; }
  #locText, #story { font-weight: 500; letter-spacing: -.005em; -webkit-font-smoothing: auto; }
  h1, #locName, .menu-title, .q-title, .pname b { font-weight: 700; }
  #locText b, #story b { font-weight: 900; }
  h1, #locName { color: #e6d3a8; letter-spacing: .02em; }
  #mapwrap { box-shadow: inset 0 0 60px rgba(60, 35, 10, .55); border: 1px solid #5a4630; }
  main { max-width: 1240px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }

  /* ===== [2] 지도 모양 ===== */
  #mapwrap { background: var(--sea); border-radius: 12px; overflow: hidden; } /* 지도는 항상 화면 폭에 맞춰 크기가 바뀜 */
  svg { width: 100%; height: auto; display: block; user-select: none; -webkit-user-select: none; }
  html { -webkit-text-size-adjust: 100%; }
  .road { stroke: var(--map-ink); stroke-width: 6; opacity: .5; fill: none; stroke-linecap: round; }
  .road.d-low { stroke: #5f7a3c; } .road.d-mid { stroke: #b8862a; } .road.d-high { stroke: #8e2a1e; } /* 이끼색=안전, 황토=보통, 핏빛=위험 */
  .road.oneway { marker-end: url(#arrow); }
  #arrow path { fill: #5f7a3c; }                 /* 일방통행: 화살표 방향으로만 이동 */
  .road.secret { stroke-dasharray: 6 16; opacity: .85; } /* 숨겨진 길 (찾은 뒤에만 보임) */
  .road.blocked, .road.locked, .road.stub { stroke: #6e6252; stroke-dasharray: 6 12; opacity: .45; }
  .xmark { stroke: #d33; stroke-width: 7; stroke-linecap: round; }
  .place.locked circle { fill: #a8987a; stroke-dasharray: 6 6; }
  .place.locked text { opacity: .55; font-size: 28px; }
  /* 확인만 하고 가 보지 않은 길과 장소: 회색 점선, ??? */
  .road.seen { stroke: #6e6252; stroke-dasharray: 6 14; opacity: .7; stroke-width: 5; }
  .place.unknown circle { fill: #c4b28c; stroke: #6e6252; stroke-dasharray: 6 6; }
  .place.unknown text { fill: #5e5242; }
  .place circle { fill: var(--land); stroke: var(--map-ink); stroke-width: 4; }
  .place[data-kind="town"] circle { fill: var(--town); stroke-width: 7; } /* 마을은 주황색 + 굵은 테두리 */
  .place text { fill: var(--map-ink); font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-weight: 800; font-size: 34px; text-anchor: middle; paint-order: stroke; stroke: var(--sea); stroke-width: 6px; }
  .place.reachable { cursor: pointer; }
  /* 의뢰 표시: ! = 받을 수 있는 의뢰, ? = 완료 보고를 할 수 있는 곳 */
  .mark { pointer-events: none; }
  .mark .mk { transform-box: fill-box; animation: bob 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .mark circle { stroke: var(--map-ink); stroke-width: 4; }
  .mark.offer circle { fill: #d9a441; }
  .mark.ready circle { fill: #9aa66a; }
  .mark text { font-size: 40px; font-weight: 800; text-anchor: middle; fill: #1e150c; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .mark .mk { animation: none; } }
  /* 지금 위치에서 갈 수 있는 길: 굵은 실선 + 캐릭터 색으로 표시 */
  .road.open { stroke-width: 14; opacity: 1; } /* 지금 갈 수 있는 길: 굵고 진하게 */
  /* 캐릭터가 천천히 미끄러지듯 움직이게 하는 설정 */
  #hero { transition: transform .8s ease-in-out; }
  #hero rect { fill: var(--hero); stroke: var(--map-ink); stroke-width: 4; }

  /* ===== [3] 설명 글과 선택 버튼 ===== */
  #story b { font-weight: 800; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
  .cap { font-size: .72rem; font-weight: 700; letter-spacing: .08em; opacity: .6; }
  /* 캐릭터 정보: 한눈에 보이도록 작게 */
  .hud { padding: 7px 10px; font-size: .8rem; }
  .hud-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .hud .pill { font-size: .74rem; padding: 1px 8px; }
  .hp { display: flex; align-items: center; gap: 6px; flex: 1 1 140px; }
  .hp .meter-bar { flex: 1; height: 6px; margin: 0; }
  #hpBar { display: block; }
  .hud .kv { flex-direction: row; gap: 3px; align-items: center; }
  .hud b { font-variant-numeric: tabular-nums; }
  .stat-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin: 5px 0 3px; }
  .stat-row .stat { padding: 2px 0; border-radius: 5px; line-height: 1.15; }
  .stat-row .stat .n { font-size: .6rem; }
  .stat-row .stat b { font-size: .84rem; }
  .stat-row .stat b.gear { color: var(--mv); }
  .stat-row .stat i { font-style: normal; font-size: .6rem; color: var(--ac); margin-left: 2px; }
  .hud .hud-row { font-size: .74rem; margin-top: 2px; gap: 6px; align-items: center; }
  .hud .hud-row > .k { flex: 0 0 2.2em; }
  .hud .chip, .hud button.chip { font-size: .68rem; padding: 0 7px; }
  .hud .gear-sum { font-size: .66rem; }
  .hud-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .pill { font-size: .8rem; padding: 2px 10px; border-radius: 999px; background: var(--town); }
  .hud-main { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; align-items: end; }
  .meter-lbl { display: flex; justify-content: space-between; align-items: baseline; }
  .meter-bar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; margin-top: 4px; }
  #hpBar { height: 100%; width: 100%; border-radius: 6px; transition: width .4s, background .4s; }
  .kv { display: flex; flex-direction: column; }
  .k { font-size: .75rem; opacity: .7; }
  .v { font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .stat-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 12px 0 6px; }
  .stat { text-align: center; padding: 6px 2px; border-radius: 8px; background: var(--tile); }
  .stat .n { font-size: .72rem; opacity: .75; }
  .stat .val { font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .stat .b { font-size: .68rem; color: var(--ac); min-height: 1em; }
  .stat .g { font-size: .66rem; color: var(--mv); }
  .hud-row { display: flex; gap: 10px; align-items: baseline; font-size: .88rem; margin-top: 6px; }
  .hud-row > .k { flex: 0 0 2.6em; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: .78rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--tile); }
  .muted { opacity: .55; }
  .story-card { background: var(--paper); border-left: 4px solid var(--edge); }
  .story-card.typing { cursor: pointer; }
  .story-card.typing #story::after { content: "▌"; animation: blink .8s steps(1) infinite; opacity: .6; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .story-card.typing #story::after { animation: none; } }
  #choices { margin-top: 12px; }
  [hidden] { display: none !important; }
  /* 가방·장비 칩: 장비는 눌러서 착용 */
  button.chip { min-height: 0; padding: 2px 9px; font-size: .78rem; border-radius: 999px; cursor: pointer; }
  button.chip.gear { border: 1px dashed var(--mv); color: var(--mv); background: transparent; }
  button.chip.gear:disabled { opacity: .45; cursor: not-allowed; }
  .chip.on { border-color: var(--ac); background: color-mix(in srgb, var(--ac) 14%, transparent); font-weight: 700; }
  .gear-sum { font-size: .75rem; opacity: .7; margin-left: 4px; }
  /* 메뉴(상점·대장간·훈련장) */
  .menu { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .menu-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--tile); }
  .menu-title { font-weight: 700; font-size: 1.05rem; }
  .menu-sub { font-size: .8rem; opacity: .7; }
  .menu-head button { min-height: 36px; padding: 4px 14px; font-size: .9rem; }
  .menu-sec { padding: 4px 14px 8px; border-bottom: 1px solid var(--line); }
  .menu-sec:last-child { border-bottom: 0; }
  .sec-title { display: flex; justify-content: flex-start; align-items: center; gap: 8px; font-size: .78rem; font-weight: 700; opacity: .8; padding: 8px 0 4px; cursor: default; list-style: none; }
  .sec-title::-webkit-details-marker { display: none; }
  details.menu-sec > summary.sec-title { cursor: pointer; }
  details.menu-sec > summary.sec-title::before { content: "▸ "; }
  details.menu-sec[open] > summary.sec-title::before { content: "▾ "; }
  .sec-title .note { font-weight: 400; opacity: .8; }
  .sec-title button { margin-left: auto; min-height: 32px; padding: 2px 12px; font-size: .8rem; font-weight: 700; }
  .mrow { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "info act" "meta act"; column-gap: 12px; row-gap: 2px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
  .mrow:first-of-type { border-top: 0; }
  .mrow.dim { opacity: .5; }
  .mi { grid-area: info; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
  .mi .ic { width: 1.3em; text-align: center; flex: none; }
  .mn { font-weight: 700; }
  .md { font-size: .78rem; opacity: .75; }
  .mm { grid-area: meta; font-size: .78rem; display: flex; flex-wrap: wrap; gap: 4px 8px; padding-left: calc(1.3em + 8px); }
  .mrow > button, .mrow > .badge { grid-area: act; }
  .mrow > button { min-height: 38px; padding: 4px 14px; font-size: .88rem; border-color: var(--ac); }
  .badge { font-size: .75rem; padding: 3px 10px; border-radius: 999px; background: var(--tile); border: 1px solid var(--line); white-space: nowrap; }
  .badge.on { border-color: var(--ac); color: var(--ac); font-weight: 700; }
  .cost { padding: 0 6px; border-radius: 6px; background: var(--tile); font-variant-numeric: tabular-nums; }
  .cost.no { color: var(--hero); }
  .price { font-weight: 700; font-variant-numeric: tabular-nums; }
  .up { color: var(--ac); font-weight: 700; }
  #choices .menu button { flex: none; text-align: center; } /* 좁은 화면의 '버튼 한 줄에 하나' 규칙에서 메뉴는 제외 */
  .mrow.noic .mm { padding-left: 0; }
  .menu-empty { font-size: .82rem; opacity: .6; padding: 6px 0; }
  /* 캐릭터 만들기 */
  .mk-lead { margin: 6px 0 10px; line-height: 1.6; font-size: .92rem; white-space: pre-line; }
  .mk-left { font-size: 1rem; margin-bottom: 8px; }
  .mk-left b { font-size: 1.4rem; color: var(--rl); font-variant-numeric: tabular-nums; }
  .mk-left.done b { color: var(--ac); }
  .mk-row { display: grid; grid-template-columns: 1fr auto 4.2em auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .mk-name { font-weight: 700; }
  .mk-info { display: block; font-size: .78rem; opacity: .7; font-weight: 400; line-height: 1.4; }
  .mk-val { text-align: center; font-weight: 700; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .mk-val small { display: block; font-size: .7rem; font-weight: 400; color: var(--ac); min-height: 1em; }
  .mk-row button { width: 44px; padding: 0; font-size: 1.2rem; font-weight: 700; }
  .mk-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .mk-go { border-color: var(--ac); border-width: 3px; font-weight: 700; }
  .mk-hint { font-size: .85rem; opacity: .75; margin: 8px 0 0; min-height: 1.2em; }
  #choices { display: flex; flex-wrap: wrap; gap: 8px; }
  #quest { margin-top: 12px; padding: 8px 10px; border-left: 4px solid var(--rl); background: var(--tile); border-radius: 6px; font-size: .9rem; line-height: 1.5; }

  /* 선택지 묶음: 이동(파랑) / 행동(초록, 판정 없음) / 도전(주황 점선, 주사위 판정) */
  .grp { flex: 1 1 100%; margin-top: 4px; }
  .grp-title { font-size: .8rem; font-weight: 700; color: var(--c); margin: 0 0 6px; }
  .grp-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .grp[data-k="move"] { --c: var(--mv); }
  .grp[data-k="act"]  { --c: var(--ac); }
  .grp[data-k="roll"] { --c: var(--rl); }
  .grp button { border-color: var(--c); border-left-width: 8px; text-align: left; }
  .grp[data-k="roll"] button { border-style: dashed; border-left-style: solid; }
  .grp[data-k="roll"] button::before { content: "\1F3B2  "; } /* 주사위 표시 */
  .grp button .sub { display: block; font-size: .8rem; opacity: .75; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #modal[hidden] { display: none; }
  #modal .box { background: var(--card); color: var(--ink); border: 2px solid var(--edge); border-radius: 12px; padding: 20px 24px; text-align: center; }
  #modal .row { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
  #modal { padding: 16px; }
  #modal .box { max-width: 90vw; }
  /* 모바일: 지도는 화면 폭에 맞춰 줄어들고(대신 지도 글자와 표시를 키움), 선택 버튼은 두 칸씩 작게 */
  @media (max-width: 700px) {
    main { padding: 12px; }
    h1 { font-size: 1.15rem; }
    .place text { font-size: 54px; font-weight: 700; transform: translateY(16px); stroke-width: 9px; }
    .place circle { stroke-width: 6; r: 48px; }
    .mark circle { r: 42px; stroke-width: 6; }
    .mark text { font-size: 62px; transform: translateY(8px); }
    #hero rect { transform: scale(1.3); transform-box: fill-box; transform-origin: center; }
  }
  @media (max-width: 520px) {
    .grp { margin-top: 2px; }
    .grp-title { font-size: .74rem; margin-bottom: 4px; }
    .grp-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grp button { min-height: 0; padding: 6px 8px; font-size: .85rem; line-height: 1.25; border-width: 1.5px; border-left-width: 5px; border-radius: 7px; }
    .grp button .sub { font-size: .68rem; margin-top: 1px; }
    .grp[data-k="roll"] button::before { content: "🎲 "; font-size: .8em; }
    .menu-head button, .mrow > button { min-height: 32px; padding: 3px 12px; font-size: .84rem; }
    .card { padding: 10px 12px; }
    #modal .row button { flex: 1; }
    .stat-grid { grid-template-columns: repeat(4, 1fr); }
    .hud-main { grid-template-columns: 1fr 1fr; }
    .hud-main .meter { grid-column: 1 / -1; }
  }
  button { font: inherit; color: var(--ink); background: var(--btn); border: 2px solid var(--edge);
           border-radius: 8px; padding: 10px 16px; min-height: 44px; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; } /* 손가락으로 누르기 쉬운 크기 */
  @media (hover: hover) { button:hover:not(:disabled) { background: var(--hover); } } /* 터치 화면에서는 hover 색이 남지 않게 */
  button:focus-visible { outline: 3px solid var(--hero); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: wait; }

  /* ===== [29] 화면 배치: 컴퓨터는 왼쪽(지도·장소·선택지·이야기) + 오른쪽(프로필·인벤·의뢰) 두 줄,
     핸드폰은 위에서부터 지도 → 장소 → 선택지|이야기 → 프로필·인벤|의뢰 ===== */
  #maker { max-width: 640px; margin: 0 auto; }
  #maker h1 { margin: 0 0 8px; }
  .mk-namerow { display: flex; align-items: center; gap: 10px; font-weight: 700; margin: 0 0 8px; }
  .mk-namerow input { font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--edge); border-radius: 8px; padding: 6px 10px; width: 12em; max-width: 60%; }
  #game:not([hidden]) { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
  #left { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  #left > .card { margin-top: 0; }
  #locName { font-size: 1.35rem; margin: 4px 2px 0; }
  .loc-card { background: var(--paper); cursor: default; }
  .loc-card.typing { cursor: pointer; }
  #locText { --lh: 1.7; margin: 0; line-height: 1.7; white-space: pre-line; min-height: 3.4em; }
  .loc-card.typing #locText::after, .story-card.typing #story::after { content: "▌"; animation: blink .8s steps(1) infinite; opacity: .6; }
  #locText b, #story b { font-weight: 800; }
  .play { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 10px; height: 430px; }
  .play > .card { margin-top: 0; display: flex; flex-direction: column; min-height: 0; }
  .choice-card { padding: 10px; }
  #choices { flex: 1; min-height: 0; overflow-y: auto; margin-top: 6px; display: flex; flex-direction: column; flex-wrap: nowrap; gap: 6px; container-type: inline-size; padding-right: 2px; }
  #choices > button { width: 100%; }
  #choices { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  #choices > * { flex-shrink: 0; }   /* 상점 메뉴가 칸에 맞춰 찌그러져 잘리지 않고, 칸 안에서 스크롤되게 함 */
  #choices .pending { opacity: 0; pointer-events: none; }
  #choices .grp-btns > button, #choices .mrow, #choices > button, #choices .menu-head, #choices .sec-title { transition: opacity .25s; }
  .grp:not(:has(.grp-btns > button:not(.pending))) .grp-title { opacity: 0; }   /* 묶음 제목은 첫 버튼과 함께 나옴 */
  .grp { flex: none; margin-top: 0; }
  .grp-btns { display: flex; flex-direction: column; gap: 6px; }
  .grp button { width: 100%; min-height: 0; padding: 8px 10px; line-height: 1.3; }
  #story { flex: 1; min-height: 0; overflow-y: auto; margin: 6px 0 0; --lh: 1.65; line-height: 1.65; white-space: pre-line; }
  /* 판정 주사위 */
  .dicebox { display: flex; align-items: center; justify-content: flex-end; gap: 8px; border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 8px; }
  .dlabel { font-size: .72rem; opacity: .7; margin-right: auto; }
  .dlabel b { font-weight: 700; }
  .dface { display: inline-grid; place-items: center; min-width: 46px; height: 46px; padding: 0 4px; border: 2px solid var(--edge); border-radius: 10px; font-size: 1.35rem; font-weight: 800; background: var(--btn); font-variant-numeric: tabular-nums; }
  .dmod { font-size: 1.05rem; font-weight: 700; color: var(--ac); min-width: 1.6em; }
  .dtot { font-size: .85rem; opacity: .8; }
  .dicebox.crit .dface { background: #d9a441; color: #1e150c; }
  .dicebox.fumble .dface { background: #8e2a1e; color: #f0dcc0; }
  .dicebox.rolled .dface { animation: roll .35s ease-out; }
  @keyframes roll { 0% { transform: rotate(-25deg) scale(.8); } 100% { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .dicebox.rolled .dface { animation: none; } .loc-card.typing #locText::after { animation: none; } }
  /* 오른쪽: 프로필, 인벤, 의뢰 */
  #side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 12px; }
  #side > .card { margin-top: 0; }
  #profile { display: grid; grid-template-columns: 76px 1fr; gap: 8px 12px; align-items: center; }
  .portrait { width: 76px; height: 76px; border: 2px dashed var(--line); border-radius: 10px; display: grid; place-items: center; font-size: .72rem; opacity: .8; background: var(--tile); overflow: hidden; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; }
  .pname { font-size: 1.05rem; margin-bottom: 4px; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
  .pname .lv { font-size: .8rem; opacity: .75; }
  .meter { display: flex; align-items: center; gap: 6px; font-size: .8rem; margin-top: 3px; }
  .meter .k { flex: none; }
  .meter .meter-bar { flex: 1; height: 7px; margin: 0; }
  .meter b { font-variant-numeric: tabular-nums; font-size: .78rem; min-width: 3.6em; text-align: right; }
  #mpBar { display: block; height: 100%; width: 100%; background: #7d8590; border-radius: 6px; }
  .bonus-grid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
  .bonus-grid .bn { grid-column: span 4; text-align: center; background: var(--tile); border-radius: 6px; padding: 3px 0; font-size: .78rem; }
  .bonus-grid .bn.r2 { grid-column: span 3; }
  .bonus-grid .bn b { margin-left: 3px; color: var(--ac); }
  .bonus-grid .bn.gear b { color: var(--mv); }
  .inv-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .inv-head .gold { font-size: .85rem; }
  .inv-body { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; justify-content: center; }
  .doll { display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(4, 40px); gap: 4px;
          grid-template-areas: ". head ." "arm body back" "lh . rh" ". legs ."; }
  .slot { position: relative; display: grid; place-items: center; border: 1.5px solid var(--line); border-radius: 8px; background: var(--tile); font-size: 1.15rem; padding: 0; min-height: 0; width: 40px; height: 40px; }
  .slot .sl { position: absolute; bottom: 1px; left: 0; right: 0; font-size: .5rem; opacity: .6; text-align: center; pointer-events: none; }
  .slot.on { border-color: var(--ac); background: color-mix(in srgb, var(--ac) 14%, var(--tile)); }
  .slot.empty { opacity: .6; }
  button.slot { cursor: pointer; }
  .bagwrap { display: flex; flex-direction: column; gap: 4px; }
  .inv-tabs { display: flex; gap: 3px; }
  .inv-tabs button { min-height: 0; padding: 1px 0; width: 28px; font-size: .72rem; border-width: 1.5px; border-radius: 6px; }
  .inv-tabs button.on { background: var(--ink); color: var(--bg); }
  .bag-grid { display: grid; grid-template-columns: repeat(4, 36px); grid-template-rows: repeat(5, 36px); gap: 3px; }
  .cell { position: relative; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; background: var(--tile); font-size: 1.1rem; padding: 0; min-height: 0; width: 36px; height: 36px; }
  .cell .cnt { position: absolute; right: 2px; bottom: 0; font-size: .6rem; font-weight: 700; }
  .cell.gear { border: 1.5px dashed var(--mv); }
  .cell.sel { outline: 2px solid var(--hero); outline-offset: -1px; }
  .atk { font-size: .72rem; opacity: .75; text-align: center; margin-top: 6px; }
  .bag-info { font-size: .75rem; min-height: 1.4em; margin-top: 4px; opacity: .85; }
  #questCard { min-height: 220px; }
  #quest { margin-top: 6px; font-size: .86rem; line-height: 1.55; border: 0; background: none; padding: 0; }
  .q-now { padding: 8px 10px; border-left: 4px solid var(--rl); background: var(--tile); border-radius: 6px; }
  .q-title { font-weight: 800; }
  .q-bar { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 4px 0 2px; }
  .q-bar span { display: block; height: 100%; background: var(--ac); }
  .q-ready { color: var(--ac); font-weight: 700; }
  .q-done-title { font-size: .72rem; font-weight: 700; opacity: .6; margin: 10px 0 2px; }
  .q-done { margin: 0; padding-left: 0; list-style: none; font-size: .8rem; opacity: .7; }
  .q-done li::before { content: "✔ "; color: var(--ac); }
  /* 선택지 칸이 좁을 때(핸드폰): 메뉴 줄을 위아래로 쌓음 */
  @container (max-width: 300px) {
    .mrow { grid-template-columns: 1fr; grid-template-areas: "info" "meta" "act"; }
    .mrow > button, .mrow > .badge { justify-self: start; margin-top: 4px; }
    .mm { padding-left: 0; }
    .menu-head { flex-wrap: wrap; padding: 8px 10px; }
    .menu-sec { padding: 4px 10px 8px; }
    .sec-title { flex-wrap: wrap; }
  }
  @media (max-width: 900px) {
    #game:not([hidden]) { grid-template-columns: 1fr; }
    #side { position: static; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "profile quest" "inv quest"; gap: 10px; align-items: start; }
    #profile { grid-area: profile; } #invCard { grid-area: inv; } #questCard { grid-area: quest; align-self: stretch; }
  }
  @media (max-width: 600px) {
    main { padding: 10px; }
    /* 핸드폰: 장소 설명 → 이야기 → 선택지 순서로 위아래로 쌓고, 선택지 칸은 내용만큼 길어짐 (안쪽 스크롤 없음) */
    .play { display: flex; flex-direction: column; height: auto; gap: 8px; }
    #storyCard { order: -1; min-height: 11em; }
    #story { overflow: visible; flex: none; }
    #choices { overflow: visible; flex: none; }
    .play > .card, #side > .card { padding: 8px; }
    #story { font-size: .92rem; --lh: 1.6; }
    #locText { font-size: .9rem; }
    #locName { font-size: 1.15rem; }
    .grp-title { font-size: .72rem; margin-bottom: 4px; }
    .grp button { padding: 6px 7px; font-size: .8rem; border-left-width: 5px; border-width: 1.5px; border-radius: 7px; }
    .grp button .sub { font-size: .66rem; }
    .dface { min-width: 36px; height: 36px; font-size: 1.05rem; }
    .dlabel { font-size: .62rem; }
    .dtot { font-size: .72rem; }
    #side { gap: 6px; }
    #profile { grid-template-columns: 48px 1fr; gap: 6px; }
    .portrait { width: 48px; height: 48px; font-size: .6rem; }
    .pname { font-size: .9rem; }
    .meter { font-size: .68rem; gap: 4px; }
    .meter b { font-size: .66rem; min-width: 3em; }
    .bonus-grid .bn { font-size: .62rem; padding: 2px 0; }
    .bonus-grid .bn b { margin-left: 1px; }
    .doll { grid-template-columns: repeat(3, 30px); grid-template-rows: repeat(4, 30px); gap: 3px; }
    .slot { width: 30px; height: 30px; font-size: .9rem; }
    .slot .sl { font-size: .42rem; }
    .bag-grid { grid-template-columns: repeat(4, 30px); grid-template-rows: repeat(5, 30px); gap: 2px; }
    .cell { width: 30px; height: 30px; font-size: .9rem; }
    .inv-tabs button { width: 24px; }
    #quest { font-size: .76rem; }
    .menu-title { font-size: .9rem; } .menu-sub, .md, .mm, .sec-title { font-size: .7rem; }
    .mn { font-size: .82rem; }
    .menu-head button, .mrow > button, .sec-title button { min-height: 30px; padding: 2px 10px; font-size: .78rem; }
    #questCard { min-height: 0; }
  }
  /* ===== [33] 글이 나오는 칸(장소 설명·이야기·의뢰): 연한 황토색 양피지 + 검은 글자 ===== */
  :root { --parch: #dcc79b; --parch-hi: #e8d7b0; --parch-ink: #17110a; --parch-line: #a88f63; --parch-name: #5a2e14; }
  .loc-card, .story-card { background: linear-gradient(180deg, var(--parch-hi), var(--parch)); color: var(--parch-ink);
    border: 1px solid #6b5233; box-shadow: inset 0 0 28px rgba(110, 72, 30, .35), 0 2px 10px rgba(0,0,0,.5); }
  .story-card { border-left: 5px solid #5a4126; }
  .loc-card .cap, .story-card .cap { color: #4a3520; opacity: .8; }
  #locText b, #story b { color: var(--parch-name); }
  #locText, #story, .mk-lead { text-align: justify; }   /* 문장은 양쪽 정렬 */
  .story-card .dicebox { border-top-color: var(--parch-line); }
  .story-card .dlabel { color: #3a2a18; }
  .story-card .dface { background: #f1e4c4; color: var(--parch-ink); border-color: #5a4126; }
  .story-card .dmod { color: #5a3a14; }
  .story-card .dtot { color: var(--parch-ink); }
  .story-card .dicebox.crit .dface { background: #d9a441; }
  .story-card .dicebox.fumble .dface { background: #8e2a1e; color: #f3e3c3; }
  #locName { color: #e3cf9f; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  /* 의뢰 칸도 양피지 쪽지처럼 */
  .q-now { background: linear-gradient(180deg, var(--parch-hi), var(--parch)); color: var(--parch-ink); border-left-color: #5a4126; box-shadow: inset 0 0 16px rgba(110,72,30,.3); }
  .q-now .q-ready { color: #3f5a1e; }
  .q-now .q-bar { background: #b9a276; } .q-now .q-bar span { background: #5a4126; }
  /* 나머지: 가죽처럼 어두운 갈색 카드와 양피지색 테두리로 맞춤 */
  :root { --card: #1e1812; --tile: #2b231a; --line: #4a3c2b; --btn: #2a2118; --hover: #3a2e21; --edge: #9a7d55; --ink: #e4d3ae; }
  .card:not(.loc-card):not(.story-card) { box-shadow: 0 2px 10px rgba(0,0,0,.45); }
  .menu { background: #231c15; border-color: var(--line); }
  .menu-head { background: #2f251a; }
  .grp button, .mrow > button { background: #2a2118; }
  .cap { color: #c9b083; opacity: .75; }
  .loc-card.typing #locText::after, .story-card.typing #story::after { content: none; }   /* 타자 중 깜빡이는 네모 없음 */
  /* NPC 이름표: 각진 네모로 묶인 한 덩어리 */
  .npc { display: inline-block; white-space: nowrap; text-indent: 0; border: 1.5px solid #5a2e14; border-radius: 0; padding: 0 .4em; margin-right: .45em;
         background: rgba(90, 46, 20, .1); color: #5a2e14; font-weight: 900; line-height: 1.4; }
  /* 행간: 저절로 줄이 넘어간 곳은 원래 행간의 90%, 직접 줄을 바꾼 곳(엔터)은 원래 행간 그대로.
     --lh(원래 행간)만 바꾸면 둘 다 같이 바뀜 */
  #locText, #story { line-height: calc(var(--lh) * .9); }
  #locText .ln, #story .ln { display: block; }
  #locText .ln + .ln, #story .ln + .ln { margin-top: calc(var(--lh) * .1em); }
  #locText .ln:empty, #story .ln:empty { height: calc(var(--lh) * .8em); }   /* 빈 줄: 위아래 간격과 합쳐서 원래 한 줄 높이 */
  /* 배경음악 켜기/끄기 버튼 */
  #bgmBtn { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20; min-height: 0; width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 1.1rem; background: var(--card); box-shadow: 0 2px 10px rgba(0,0,0,.6); }
  #bgmBtn.off { opacity: .6; }
</style>
</head>
<body>
<main>
  <!-- ===== 캐릭터 만들기: 게임 시작 전에 이름을 정하고 스탯을 나눕니다 ===== -->
  <section id="maker" class="card" aria-label="캐릭터 만들기">
    <h1>작은 섬 탐험</h1>
    <div class="cap">캐릭터 만들기</div>
    <p class="mk-lead" id="mkLead"></p>
    <label class="mk-namerow">이름 <input id="mkName" maxlength="12" value="모험가" autocomplete="off"></label>
    <div class="mk-left">남은 점수 <b id="mkLeft"></b> / 16</div>
    <div id="mkRows"></div>
    <div class="mk-btns">
      <button id="mkReset">초기화</button>
      <button id="mkRandom">무작위로 나누기</button>
      <button id="mkStart" class="mk-go">모험 시작</button>
    </div>
    <p id="mkHint" class="mk-hint"></p>
  </section>

  <div id="game" hidden>
    <!-- 왼쪽(핸드폰은 위쪽): 지도 → 지금 있는 곳 이름 → 장소 설명 → 선택지 | 이야기 -->
    <div id="left">
      <!-- ===== [4] 지도 그림 자리: 장소와 길은 아래 JavaScript가 그려 넣습니다 ===== -->
      <div id="mapwrap">
      <svg id="map" viewBox="40 30 1820 1340" role="img" aria-label="섬 지도">
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" orient="auto"><path d="M0,0 L10,5 L0,10 z"></path></marker></defs>
        <g id="roads"></g>
        <g id="places"></g>
        <g id="marks"></g>
        <g id="hero"><rect x="-22" y="-22" width="44" height="44" rx="6"></rect></g>
      </svg>
      </div>

      <h2 id="locName"></h2>
      <!-- 장소 설명: 도착했을 때의 묘사, 상점·여관에 들어가면 그 건물의 기본 묘사 -->
      <section id="locCard" class="card loc-card" aria-label="장소 설명"><p id="locText"></p></section>

      <div class="play">
        <section class="card choice-card" aria-label="선택지"><div class="cap">선택지</div><div id="choices"></div></section>
        <!-- 이야기 칸: 선택지 결과, NPC 대화, 전투 기록 + 판정 주사위 -->
        <section id="storyCard" class="card story-card" aria-label="이야기" title="">
          <div class="cap">이야기</div>
          <p id="story" aria-live="polite"></p>
          <div id="diceBox" class="dicebox" aria-label="판정 주사위">
            <span class="dlabel">판정 주사위<br><b id="diceText">1D20</b></span>
            <span id="diceFace" class="dface">–</span><span id="diceMod" class="dmod"></span><span id="diceTot" class="dtot"></span>
          </div>
        </section>
      </div>
    </div>

    <!-- 오른쪽(핸드폰은 아래쪽): 프로필, 인벤, 의뢰 -->
    <aside id="side">
      <section id="profile" class="card" aria-label="프로필">
        <div id="portrait" class="portrait"><span>초상화</span></div>
        <div>
          <div class="pname"><b id="heroName"></b><span class="lv">Lv. <b id="lvText"></b></span></div>
          <div class="meter" title="체력"><span class="k">체력</span><span class="meter-bar"><span id="hpBar"></span></span><b id="hpText"></b></div>
          <div class="meter" title="마력 (아직 쓰이는 곳이 없음)"><span class="k">마력</span><span class="meter-bar"><span id="mpBar"></span></span><b id="mpText"></b></div>
        </div>
        <div id="stats" class="bonus-grid"></div>
      </section>
      <section id="invCard" class="card" aria-label="인벤">
        <div class="inv-head"><span class="cap">인벤</span><span class="gold" title="금화">💰 <b id="goldText"></b></span></div>
        <div class="inv-body">
          <div id="doll" class="doll"></div>
          <div class="bagwrap"><div id="invTabs" class="inv-tabs"></div><div id="bagGrid" class="bag-grid"></div></div>
        </div>
        <div id="atkText" class="atk"></div>
        <div id="bagInfo" class="bag-info"></div>
      </section>
      <section id="questCard" class="card" aria-label="의뢰"><div class="cap">의뢰</div><div id="quest"></div></section>
    </aside>
  </div>
</main>

<button id="bgmBtn" title="배경음악 끄기" aria-label="배경음악 끄기">🔊</button>

<!-- 도망 확인 팝업: 평소에는 숨겨져 있다가 [도망친다]를 누르면 나타납니다 -->
<div id="modal" hidden>
  <div class="box" role="dialog" aria-modal="true">
    <p>정말 도망치시겠습니까?</p>
    <p id="escHint"></p>
    <div class="row"><button id="yes">예</button><button id="no">아니오</button></div>
  </div>
</div>

<script>
  /* ===== [5] 장소 데이터: 새 장소는 places에 한 덩어리, 새 길은 roadList에 한 줄 추가하세요 =====
     x, y   : 지도 위 위치 (지도 그림의 좌표 그대로)
     text   : 도착했을 때 보여줄 설명
     mons   : 이 장소 근처에서 만날 수 있는 몬스터 이름들 ([11]의 monsters 표 참고)
     locked : 지금은 갈 수 없는 곳 (흐리게 표시) */
  const places = {
    village:   { name: "시작 마을", x: 1127, y: 1057, text: "제국의 수도 인근에 있는 작은 마을. \n수도와 인접한 덕에 재앙이 일어나기 시작한 당시 발빠르게 축복을 받았고, 덕분에 강한 몬스터가 상대적으로 적다고 한다. \n그만큼 축복의 영향력을 벗어난 구역에는 손쓸 수 없이 강한 것들도 있는 모양이지만.", mons: ["슬라임"] },
    forest:    { name: "숲",       x: 1213, y: 658,  text: "키 큰 나무가 햇빛을 가린다. 어디선가 새소리가 들린다.", mons: ["슬라임", "고블린", "멧돼지"] },
    meadow:    { name: "초원",     x: 873,  y: 795,  text: "바람에 풀이 물결치는 넓은 초원이다. 멀리서 짐승 울음소리가 들린다.", mons: ["멧돼지", "늑대"] },
    lake:      { name: "호수",     x: 498,  y: 375,  text: "잔잔한 호수에 구름이 비친다. 물가에 작은 배가 묶여 있다.", mons: ["슬라임"] },
    mountainW: { name: "산",       x: 848,  y: 377,  text: "서쪽 산의 정상에 오르니 호수와 초원이 한눈에 내려다보인다.", mons: ["늑대", "곰"] },
    mountainE: { name: "산",       x: 1433, y: 550,  text: "바람이 거센 동쪽 산등성이다. 멀리 눈 덮인 봉우리가 보인다.", mons: ["늑대", "곰"] },
    swamp:     { name: "늪지",     x: 390,  y: 675,  text: "발이 푹푹 빠지는 축축한 늪이다. 안개 사이로 무언가 움직인다.", mons: ["독사", "악어"] },
    harbor:    { name: "항구 마을", x: 200,  y: 512,  text: "갈매기가 날고 짠 바람이 부는 항구 마을이다. 배와 상인으로 북적인다.", mons: ["게"] },
    beach:     { name: "해변",     x: 133,  y: 870,  text: "하얀 모래와 파도 소리가 이어지는 해변이다.", mons: ["게", "갈매기 떼"] },
    canyon:    { name: "협곡",     x: 1022, y: 143,  text: "붉은 절벽 사이로 바람이 휘몰아치는 깊은 협곡이다.", mons: ["전갈", "곰"] },
    snowfield: { name: "설원",     x: 1488, y: 180,  text: "눈이 무릎까지 쌓인 하얀 벌판이다. 숨결이 하얗게 흩어진다.", mons: ["설원 늑대", "곰"] },
    snowtown:  { name: "눈 마을",   x: 1593, y: 362,  text: "제국의 수도 북쪽에 위치한 설산의 초입에 자리한 작은 마을.\n마을 곳곳이 눈 속에 묻혀, 다음에도 이곳에 온다면 길을 찾을 수 있을지 의문이 든다.\n어쩌면 파묻힌 채로 숨어 있기 때문에 이런 곳에 남을 수 있었던 것일지도.", mons: ["설원 늑대"] },
    caveN:     { name: "동굴",     x: 1151, y: 376,  text: "차가운 바람이 흘러나오는 어두운 동굴이다. 안쪽에서 물 떨어지는 소리가 들린다.", mons: ["동굴 박쥐", "고블린"] },
    caveS:     { name: "동굴",     x: 700,  y: 1027, text: "모래가 흘러든 메마른 동굴이다. 벽면 곳곳이 반짝인다.", mons: ["동굴 박쥐", "전갈"] },
    ruins:     { name: "고대 유적", x: 493,  y: 997,  text: "이끼 낀 돌기둥이 늘어선 옛 유적이다. 알 수 없는 문양이 새겨져 있다.", mons: ["해골 병사", "골렘"] },
    desert:    { name: "사막",     x: 752,  y: 1253, text: "끝없는 모래 언덕이 이어진다. 뜨거운 열기가 올라온다.", mons: ["전갈", "모래 도마뱀"] },
    oasis:     { name: "오아시스", x: 305,  y: 1225, text: "야자나무가 둘러싼 푸른 물웅덩이다. 지친 몸이 절로 풀린다.", mons: ["악어", "모래 도마뱀"] },
    gate:      { name: "관문",     x: 1388, y: 993,  text: "제국으로 이어지는 돌 관문이다. 무장한 경비원이 길을 막고 서 있다.", mons: ["고블린"] },
    empire:    { name: "로렌시아 제국", x: 1527, y: 1050, text: "", locked: true, labelTop: true },
    port:      { name: "항구",     x: 1729, y: 1065, text: "", locked: true },
    station:   { name: "기차역",   x: 1620, y: 1180, text: "", locked: true }
  };

  /* 길 목록: [장소A, 장소B, 위험도, 특별한 길]  위험도는 low(안전, 초록) / mid(보통, 노랑) / high(위험, 빨강)
     특별한 길: oneway = A에서 B로만 가는 일방통행 / secret = 찾아야 열리는 숨겨진 길 / blocked = 출입 금지 / locked = 아직 갈 수 없는 지역의 길
     위험도는 [15]에서 이동 시간과 사건 확률로 쓰입니다. */
  const roadList = [
    ["canyon", "snowfield", "high"], ["canyon", "mountainW", "mid"],  ["snowfield", "snowtown", "mid"],
    ["snowtown", "mountainE", "mid"], ["caveN", "mountainE", "high"],  ["mountainE", "forest", "mid"],
    ["lake", "mountainW", "low"],    ["lake", "harbor", "low"],       ["mountainW", "swamp", "high"],
    ["mountainW", "meadow", "low"],  ["harbor", "swamp", "high"],     ["harbor", "beach", "low"],
    ["swamp", "meadow", "mid"],      ["forest", "village", "low"],    ["forest", "gate", "low"],
    ["meadow", "village", "low"],    ["meadow", "desert", "mid"],     ["ruins", "caveS", "high"],
    ["caveS", "desert", "high"],     ["village", "gate", "mid"],
    ["oasis", "beach", "low", "oneway"], ["oasis", "desert", "low", "oneway"],
    ["ruins", "oasis", "high", "secret"],
    ["gate", "empire", "low", "blocked"], ["empire", "port", "low", "locked"], ["empire", "station", "low", "locked"]
  ];
  /* 지도 밖으로 이어지는 길 (모양만) */
  const roadStubs = [["port", 1860, 1112], ["station", 1712, 1330]];
  const secretFound = {};   // 찾아낸 숨겨진 길: { "ruins-oasis": true }
  const knownRoads = {};    // 지나온 길(끝까지 가 본 길): { "forest-village": true }
  const seenRoads = {};     // 한 번이라도 갈 수 있다고 확인한 길
  const visited = { village: true }; // 가 본 장소
  function roadKey(a, b) { return [a, b].sort().join("-"); }
  /* 이동할 수 있는 길만 links에 넣습니다 (일방통행은 한쪽만, 숨겨진 길은 찾은 뒤에만) */
  function buildLinks() {
    for (const pl of Object.values(places)) pl.links = [];
    for (const [a, b, , kind] of roadList) {
      if (kind === "blocked" || kind === "locked") continue;
      if (kind === "secret" && !secretFound[roadKey(a, b)]) continue;
      places[a].links.push(b);
      if (kind !== "oneway") places[b].links.push(a);
    }
  }
  buildLinks();

  let current = "village";   // 지금 캐릭터가 있는 장소
  let moving = false;        // 이동 중에는 버튼을 막기 위한 표시

  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);

  /* ===== [6] 지도 그리기: 길(점선)과 장소(동그라미+이름)를 만듭니다 ===== */
  const R = 40; // 장소 동그라미 크기
  function drawMap() {
    $("roads").innerHTML = ""; $("places").innerHTML = "";
    const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
    for (const [a, b, , kind] of roadList) {
      const A = places[a], B = places[b];
      let x1 = A.x, y1 = A.y, x2 = B.x, y2 = B.y;
      if (kind === "oneway") {            // 화살표가 동그라미에 가리지 않게 끝을 조금 당김
        const d = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / d, uy = (y2 - y1) / d;
        x2 -= ux * (R + 10); y2 -= uy * (R + 10);
      }
      const line = mk("line", { x1, y1, x2, y2, class: `road d-${roadList.find(r => r[0] === a && r[1] === b)[2]}` + (kind ? " " + kind : "") });
      line.dataset.a = a; line.dataset.b = b; line.dataset.key = roadKey(a, b); if (kind) line.dataset.kind = kind;
      if (kind === "secret" && !secretFound[roadKey(a, b)]) line.style.display = "none";
      $("roads").appendChild(line);
      if (kind === "blocked") {            // 출입 금지: 길 가운데에 빨간 X
        const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, s = 18;
        $("roads").appendChild(mk("line", { x1: mx - s, y1: my - s, x2: mx + s, y2: my + s, class: "xmark", "data-key": roadKey(a, b) }));
        $("roads").appendChild(mk("line", { x1: mx - s, y1: my + s, x2: mx + s, y2: my - s, class: "xmark", "data-key": roadKey(a, b) }));
      }
    }
    for (const [id, x, y] of roadStubs) { const st = mk("line", { x1: places[id].x, y1: places[id].y, x2: x, y2: y, class: "road stub" }); st.dataset.a = id; $("roads").appendChild(st); }
    for (const [id, p] of Object.entries(places)) {
      const g = document.createElementNS(NS, "g");
      g.setAttribute("class", "place" + (p.locked ? " locked" : ""));
      g.dataset.id = id;
      g.dataset.kind = (actions[id] && actions[id].rest) ? "town" : "wild"; // 쉴 수 있는 곳이 마을
      g.innerHTML = `<circle cx="${p.x}" cy="${p.y}" r="${R}"></circle>` +
                    `<text x="${p.x}" y="${p.labelTop ? p.y - R - 14 : p.y + R + 36}">${p.name}</text>`;
      g.addEventListener("click", () => travel(id)); // 지도에서 장소를 직접 눌러도 이동
      $("places").appendChild(g);
    }
  }

  /* ===== [26] 안개: 지나온 길과 지금 위치에서 갈 수 있는 길, 그 길이 닿는 장소만 지도에 보임 =====
     진행 중인 의뢰의 목적지(받을 곳이면 의뢰인이 있는 곳)는 길을 몰라도 표시. 관문에 가 보면 막힌 길과 제국도 보임 */
  function updateFog() {
    const nowRoad = {}, seenOnly = {}, named = { [current]: true }, shown = {};
    for (const k of Object.keys(visited)) named[k] = true;
    for (const [a, b, , kind] of roadList) {
      const key = roadKey(a, b);
      const adjacent = (a === current && places[a].links.includes(b)) || (b === current && places[b].links.includes(a));
      if (adjacent) seenRoads[key] = true;                       // 지금 갈 수 있는 길은 '확인한 길'로 기억
      if (adjacent || knownRoads[key] || (kind === "blocked" && visited[a])) {   // 관문에서 본 막힌 길 포함
        nowRoad[key] = true; named[a] = named[b] = true;
      } else if (seenRoads[key]) {                               // 예전에 확인만 한 길: 회색 점선, 끝의 장소는 ???
        seenOnly[key] = true; shown[a] = shown[b] = true;
      }
    }
    const q = curQuest();
    if (q) named[quest.status === "offer" ? q.giver : reportPlace(q)] = true;   // 진행 중인 의뢰의 목적지는 이름까지 표시
    document.querySelectorAll("#roads line").forEach(l => {
      const key = l.dataset.key, stub = l.classList.contains("stub");
      const vis = !stub && (nowRoad[key] || (seenOnly[key] && !l.classList.contains("xmark")));
      l.style.display = vis ? "" : "none";
      if (l.classList.contains("road")) l.classList.toggle("seen", !stub && !nowRoad[key] && !!seenOnly[key]);
    });
    document.querySelectorAll(".place").forEach(g => {
      const id = g.dataset.id, isNamed = !!named[id], vis = isNamed || shown[id];
      g.style.display = vis ? "" : "none";
      g.classList.toggle("unknown", vis && !isNamed);
      g.querySelector("text").textContent = isNamed ? places[id].name : "???";
    });
  }

  /* ===== [7] 화면 갱신: 설명 글, 선택 버튼, 갈 수 있는 장소 강조 ===== */
  function refresh() {
    const here = places[current];
    moving = false; // 화면이 평소 상태로 돌아오면 다시 이동할 수 있게 함
    screen = "place";
    setLoc(here.name, here.text);
    setStory("");
    $("choices").innerHTML = "";
    for (const to of here.links) { // 이동 묶음: 이름 + (위험도, 이동 시간)
      const road = roadInfo(current, to);
      addBtn(`→ ${places[to].name}`, () => travel(to), "", "move", `${road.label} / ${fmtTime(road.seconds * TRAVEL_TIME_SCALE)}`);
    }
    addActionButtons(); // 이 장소에서만 할 수 있는 행동 버튼
    updateStatus();
    visited[current] = true;
    updateFog();
    document.querySelectorAll(".place").forEach(g =>
      g.classList.toggle("reachable", here.links.includes(g.dataset.id)));
    /* 현재 장소에서 출발하는 길만 'open' 표시를 켭니다 */
    document.querySelectorAll(".road").forEach(r => {          // 지금 이동할 수 있는 길만 강조 (일방통행은 출발 쪽에서만)
      const k = r.dataset.kind, from = r.dataset.a === current, to = r.dataset.b === current;
      const ok = k !== "blocked" && k !== "locked" && !r.classList.contains("stub") && r.style.display !== "none" &&
        (from || (to && k !== "oneway"));
      r.classList.toggle("open", ok);
    });
  }

  /* ===== [8] 이동: 캐릭터를 목적지로 보내고, 도착하면 화면을 갱신합니다 ===== */
  function travel(to) {
    if (!moving && places[to].locked) return setStory(`[${places[to].name}] 관문 너머의 땅이다. 지금은 출입이 금지되어 있다.`);
    if (moving || !places[current].links.includes(to)) return; // 이동 중이거나 못 가는 곳이면 무시
    moving = true;
    lockChoices();
    document.querySelectorAll(".road").forEach(r => r.classList.remove("open")); // 이동 중에는 강조 끄기
    const road = roadInfo(current, to);                 // 이 길의 위험도와 이동 시간
    const ms = road.seconds * TRAVEL_TIME_SCALE * 1000; // 이동에 걸리는 시간(밀리초)
    const msg = `${places[current].name}에서 ${ro(places[to].name)} 이동 중...`;
    $("locName").textContent = `${places[current].name} → ${places[to].name}`;
    if (Math.random() < Math.max(0.05, road.encounter - 0.02 * (statBonus("감지") - 2))) { // 위험한 길일수록 사건이 잦고, 감지가 높으면 줄어듦
      // 인카운트 발생: 길 한가운데까지만 가서 멈춥니다 (남은 시간에는 사건 뒤의 절반도 포함해서 보여 줌)
      const from = places[current];
      $("hero").style.transitionDuration = (ms / 2000) + "s";
      $("hero").dataset.half = ms / 2;
      placeHeroAt((from.x + places[to].x) / 2, (from.y + places[to].y) / 2);
      const ev = pickEncounter(current, to);
      runTimed(msg, ms / 2, () => showEncounter(ev, to), { after: ms / 2 });
    } else {
      // 아무 일 없음: 곧장 목적지까지 갑니다
      $("hero").style.transitionDuration = (ms / 1000) + "s";
      placeHero(to);
      runTimed(msg, ms, () => arrive(to));
    }
  }

  /* ===== [21] 시간이 걸리는 일: 이동과 도전(주사위 판정 행동)은 남은 시간을 보여 주며 진행됩니다 =====
     opts.before / opts.after : 이번 구간 앞뒤로 이미 지난 / 아직 남은 시간(밀리초). 진행 막대와 남은 초에 함께 반영 */
  /* ----- 5단계 설정: 난이도와 시간 -----
     DIFF       : 1~5단계의 목표 달성치(1D20 눈 + 보정이 이 값 이상이면 성공)
     TIME_STEPS : 1~5단계의 걸리는 시간(초). 이동은 1/3/5단계, 도전은 난이도와 같은 단계를 씀 */
  const DIFF = [6, 9, 12, 15, 18];
  const TIER_NAMES = ["매우 쉬움", "쉬움", "보통", "어려움", "매우 어려움"];
  const TIME_STEPS = [1, 2, 3, 4, 5];
  const ACTION_TIME_SCALE = 1;  // 도전에 걸리는 시간 배율 (1이면 1~5초)
  function tierText(t) { return `${TIER_NAMES[t - 1]} ${DIFF[t - 1]}`; }
  let busyTick = null;
  function runTimed(msg, ms, done, opts = {}) {
    clearInterval(busyTick);
    const before = opts.before || 0, after = opts.after || 0, total = before + ms + after;
    const end = Date.now() + ms;
    const tick = () => {
      const leftMs = Math.max(0, end - Date.now()) + after;
      const filled = Math.max(0, Math.min(10, Math.round(10 * (1 - leftMs / total))));
      setStory(`${msg}\n${"▰".repeat(filled)}${"▱".repeat(10 - filled)}  ${Math.ceil(leftMs / 1000)}초 남음`);
    };
    tick();
    busyTick = setInterval(tick, 200);
    setTimeout(() => { clearInterval(busyTick); done(); }, ms);
  }
  /* 진행 중에는 선택지를 잠급니다 (팝업 버튼은 제외) */
  function lockChoices() { document.querySelectorAll("#choices button, #doll button, #bagGrid button.gear").forEach(b => b.disabled = true); }

  /* 도전에 걸리는 시간(초): 난이도 단계와 같은 시간 단계 (1단계 1초 ~ 5단계 5초) */
  function challengeTime(tier) { return TIME_STEPS[tier - 1] * ACTION_TIME_SCALE; }
  /* 도전 시작: 버튼을 잠그고 "○○ 중..." 을 보여 준 뒤, 시간이 지나면 fn(주사위 판정)을 실행 */
  function doChallenge(doing, tier, fn, key) {
    moving = true; lockChoices();
    const tired = key ? noteTry(key) : false;   // 같은 도전을 1분 안에 3번째 하는지 (제한 시간은 화면에 표시하지 않음)
    runTimed(`${doing} 중...`, challengeTime(tier) * 1000, () => {
      if (tired) startCooldown(key);           // 3번째 결과가 나오는 순간부터 쿨타임
      fn();
      if (tired) appendStory(`\n\n같은 일을 연달아 해서 지쳤다. ${COOL_SEC}초 쉬어야 다시 할 수 있다.`);
    });
  }

  /* ===== [23] 장소 도전 쿨타임: 같은 도전을 1분 안에 3번 하면 10초 동안 다시 할 수 없음 ===== */
  const COOL_WINDOW = 60, COOL_LIMIT = 3, COOL_SEC = 10;   // 1분 / 3번 / 10초
  const tryLog = {}, coolUntil = {};                       // 도전별 최근 시도 시각, 쿨타임이 끝나는 시각
  function noteTry(key) {
    const now = Date.now();
    tryLog[key] = (tryLog[key] || []).filter(t => now - t < COOL_WINDOW * 1000);
    tryLog[key].push(now);
    return tryLog[key].length >= COOL_LIMIT;
  }
  function startCooldown(key) { coolUntil[key] = Date.now() + COOL_SEC * 1000; tryLog[key] = []; }
  function coolLeft(key) { return Math.max(0, Math.ceil(((coolUntil[key] || 0) - Date.now()) / 1000)); }

  /* 쿨타임 중인 버튼: 잠그고 남은 초를 보여 주다가, 끝나면 원래 안내로 되돌림 */
  function markCooldown(b, key) {
    b.dataset.cool = key;
    b.dataset.sub = b.querySelector(".sub").textContent;
    updateCoolBtn(b);
  }
  function updateCoolBtn(b) {
    const left = coolLeft(b.dataset.cool), sub = b.querySelector(".sub");
    if (left > 0) { b.disabled = true; sub.textContent = `⏳ 쿨타임 ${left}초`; }

  function doingOf(x) { return x.doing || (x.label.endsWith("기") ? x.label.slice(0, -1) + "는" : x.label); }

  /* 한국어 조사 (으)로: 받침이 없거나 ㄹ 받침이면 "로", 그 밖의 받침이면 "으로" */
  function ro(w) {
    const c = w.charCodeAt(w.length - 1);
    if (c < 0xAC00 || c > 0xD7A3) return w + "(으)로";
    const jong = (c - 0xAC00) % 28;
    return w + (jong === 0 || jong === 8 ? "로" : "으로");
  }

        { label: "지도를 믿는다", doing: "지도를 확인하는", stat: "지력", tier: 3, hurt: 2, win: ["지도에 그런 호수는 없다. 신기루였다!"], lose: ["지도를 잘못 읽어 한참 돌아갔다."] },
        { label: "신기루를 따라가 본다", doing: "신기루를 쫓는", stat: "행운", tier: 5, gold: 12, hurt: 3, win: ["신기루 끝에서 길 잃은 대상(隊商)이 떨어뜨린 금화를 주웠다!"], lose: ["아무것도 없었다. 목만 바싹 탔다."] } ] },
    { title: "떠밀려 온 병 편지", where: ["beach", "harbor", "oasis"], text: "파도에 밀려온 유리병 안에 둘둘 말린 종이가 들어 있다.",
      choices: [
        { label: "병을 조심히 연다", doing: "병마개를 여는", stat: "재주", tier: 2, gold: 3, win: ["편지와 함께 동전 몇 닢이 들어 있었다."], lose: ["병이 깨져 편지가 젖어 버렸다."] },
        { label: "편지의 암호를 푼다", doing: "암호를 푸는", stat: "지력", tier: 3, gold: 10, win: ["해변에 묻힌 보물의 위치였다! 금화를 찾아냈다."], lose: ["뜻을 알 수 없는 낙서였다."] },
        { label: "다른 병이 있는지 둘러본다", doing: "해변을 둘러보는", stat: "행운", tier: 3, item: "금린어", win: ["병은 없었지만 파도에 밀려온 금린어를 주웠다."], lose: ["파도에 발만 젖었다."] } ] }
  ];

  /* 이 길에서 일어날 사건 고르기: BATTLE_RATE 확률로 전투, 아니면 어디서나 일어나는 사건 + 이 길 근처의 지역 사건(2배 가중치) 중 하나 */
  function pickEncounter(from, to) {
    if (Math.random() < BATTLE_RATE) return encounters[0];
    const pool = [];
    for (const e of encounters.slice(1)) {
      if (!e.where) pool.push(e);
      else if (e.where.includes(from) || e.where.includes(to)) pool.push(e, e);
    }
    return pick(pool);
  }

  /* ===== 주사위: 1D20 (20면체 1개) =====
     - 굴린 눈 + 보정이 목표 달성치 이상이면 성공
     - 눈이 1이면 펌블: 결과에 관계없이 실패 / 눈이 20이면 크리티컬: 결과에 관계없이 성공
     - 매직 주사위를 가지고 있으면 그만큼 주사위를 더 굴려 가장 높은 눈을 씀 (모두 1이어야 펌블, 하나라도 20이면 크리티컬)
     - 행운: 일정 확률로 주사위를 하나 더 굴려 가장 높은 눈을 씀 */
  /* 매직 주사위 아이템: 이름 -> 더 굴리는 주사위 개수 (shops 표의 wares에 가격을 적어야 팔립니다) */
  const MAGIC_DICE = { "마법 주사위": 1, "수정 주사위": 1 };
  function extraDice() {
    return Object.entries(MAGIC_DICE).reduce((sum, [name, n]) => sum + (bag[name] ? n : 0), 0);
  }

  function rollD20s(n) { return Array.from({ length: n }, () => Math.floor(Math.random() * 20) + 1); }

  /* 주사위를 굴려 결과를 돌려줍니다. player=false 이면 몬스터용(매직 주사위, 부적, 행운 없음) */
  function rollDice(extra = 0, player = true) {
    const dice = rollD20s(1 + (player ? extraDice() : 0));
    let note = "";
    if (player && Math.random() < (effStat("행운") - 3) * 0.03) {  // 행운 6이면 9%, 1점당 +3% (장비 포함)
      dice.push(Math.floor(Math.random() * 20) + 1); note = " (행운: 한 번 더 굴림)";
    }
    const roll = Math.max(...dice);                                    // 가장 높은 눈을 씀
    const total = roll + extra + (player && bag["행운의 부적"] ? 1 : 0); // 부적 +1
    const fumble = roll === 1;               // 쓰는 눈(보정 전)이 1일 때만 펌블 (주사위가 여럿이면 모두 1이어야 함)
    const crit = roll === 20;                // 쓰는 눈(보정 전)이 20일 때만 크리티컬. 보정 후 결과가 20을 넘어도 크리티컬이 아님
    const shown = total === roll ? `${roll}` : `${roll} ${sign(total - roll)} = ${total}`;
    const face = dice.length > 1 ? `[${dice.join(", ")}] 중 ${roll}` : `${roll}`;
    if (player) showDice(dice, roll, total, fumble, crit);
    return { dice, roll, total, fumble, crit,
             text: `🎲 ${face}${fumble ? "(펌블!)" : crit ? "(크리티컬!)" : ""}${total === roll ? "" : ` ${sign(total - roll)} = ${total}`}${note}` };
  }

  /* 이야기 칸 아래 '판정 주사위': 쓴 눈, 고정치(보정), 결과 */
  function showDice(dice, roll, total, fumble, crit) {
    const box = $("diceBox"); if (!box) return;
    $("diceFace").textContent = roll;
    $("diceMod").textContent = total === roll ? "+0" : sign(total - roll);
    $("diceTot").textContent = `= ${total}${crit ? " 크리티컬!" : fumble ? " 펌블!" : ""}`;
    $("diceFace").title = dice.length > 1 ? `굴린 눈: ${dice.join(", ")} (가장 높은 눈을 씀)` : "";
    box.classList.remove("rolled", "crit", "fumble"); void box.offsetWidth;
    box.classList.add("rolled"); if (crit) box.classList.add("crit"); if (fumble) box.classList.add("fumble");
  }

  /* 성공 판정: 펌블이면 무조건 실패, 크리티컬이면 무조건 성공, 아니면 결과가 목표 이상일 때 성공 */
  function meets(r, need) { return !r.fumble && (r.crit || r.total >= need); }
  function check(extra, need) { const r = rollDice(extra); r.ok = meets(r, need); return r; }

  /* 목록 중 하나를 무작위로 고르는 작은 함수 */
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  /* 목적지에 도착했을 때 호출됩니다: 현재 장소를 바꾸고 화면을 새로 그립니다 */
  function arrive(to) {
    knownRoads[roadKey(current, to)] = true;             // 끝까지 지나온 길은 계속 지도에 남음
    current = to;
    refresh();
    // 의뢰 안내: 이 장소에서 보고할 수 있거나 새 의뢰가 있으면 알려 줌
    const q = curQuest();
    if (q && quest.status === "active" && reportPlace(q) === current && questDone(q))
      typeStory(`의뢰 [${q.title}] 보고할 수 있다! ('행동'에서 ${buildingName(questBuilding(q.reportNpc || q.npc))}에 들어가 ${q.reportNpc || q.npc}에게 보고하기)`);
    else if (q && quest.status === "offer" && q.giver === current)
      typeStory(`${josa(q.npc, "이", "가")} 할 이야기가 있는 것 같다.`);
  }

  /* 사건 화면: 전투면 전투를 시작하고, 아니면 설명과 선택 버튼을 보여줍니다 */
  function showEncounter(e, to) {
    if (e.battle) return startBattle(to);
    typeStory(`[${e.title}] ${e.text}`);
    $("choices").innerHTML = "";
    for (const c of e.choices) { // 사건의 선택지는 모두 주사위 판정이 필요한 '도전'
      addBtn(c.label, () => doChallenge(`[${e.title}] ${c.doing || c.label}`, c.tier, () => resolveEncounter(c, to)), "", "roll",
        `${c.stat ? c.stat + " 판정 / " : ""}${tierText(c.tier)} / ${challengeTime(c.tier)}초${c.hurt ? ` / 실패하면 체력 -${c.hurt}` : ""}`);
    }
  }

  /* 선택의 성공/실패는 주사위로 정합니다: 눈이 need 이상이면 성공 */
  function resolveEncounter(c, to) {
    const ck = check(c.stat ? statBonus(c.stat) : 0, c.need), ok = ck.ok;
    if (ok && c.gold) gold += c.gold;
    if (ok && c.item) bag[c.item] = (bag[c.item] || 0) + 1; // 아이템 보상
    if (!ok && c.hurt) hurt(c.hurt); // 함정 등: 실패하면 체력이 깎임 // 보상 금화가 있는 선택지
    setStory(`${ck.text} (목표 ${c.need}) → ${ok ? "성공!" : "실패..."}\n${pick(ok ? c.win : c.lose)}${ok && c.gold ? ` (금화 +${c.gold})` : ""}${ok && c.item ? ` (${c.item} +1)` : ""}${!ok && c.hurt ? ` 체력이 ${c.hurt} 깎였다.` : ""}`);
    $("choices").innerHTML = "";
    addBtn("계속 가기", () => stamina <= 0 ? faint() : continueTrip(to), "", "move", `${ro(places[to].name)} 남은 길 이동`);
  }

  /* ===== [11] 자동 전투: 내 캐릭터는 [공격]/[방어]를 무작위로 쓰고, 플레이어는 [도망친다]만 누를 수 있습니다 ===== */
  /* 몬스터 도감
     hp=몬스터 체력, dmg=한 번 맞을 때 내 전투 HP가 깎이는 양
     atk=내 [공격] 난이도 단계, def=내 [방어] 난이도 단계 (1 매우 쉬움 6 / 2 쉬움 9 / 3 보통 12 / 4 어려움 15 / 5 매우 어려움 18)
         작고 빠르거나 껍데기가 단단하면 맞히기(atk) 어렵고, 힘이 세거나 덮쳐 오면 막기(def) 어려움
     lv=강함 등급: 내 공격/방어 난이도 단계(ATK_BY_LV/DEF_BY_LV)와 도망에 필요한 합(+lv, flee를 쓰면 그 값)을 정함. atk/def로 단계를 직접 정할 수도 있음
     gimmick=고유 기믹: 전투에서 쓰지 않는 스탯(재주, 지력, 감지, 행운)으로 전투 중 자동 [대응] 판정에 성공하면 깨짐 (공격/방어처럼 라운드마다 무작위로 발생)
       type : rage(광폭화) / hide(매복) / howl(하울링) / curse(저주) / dmgCut(돌 갑옷)
       stat, tier : 대응 판정에 쓰는 스탯과 난이도 단계,  ok / fail : 성공 / 실패 문장
     어느 장소에서 나오는지는 [5]의 places에 있는 mons 목록으로 정합니다. */
  const monsters = {
    "슬라임":     { hp: 8,  dmg: 2, lv: 0, atk: 1, def: 1 },
    "동굴 박쥐":  { hp: 6,  dmg: 2, lv: 0, atk: 2, def: 1 },
    "게":         { hp: 7,  dmg: 2, lv: 0, atk: 2, def: 1 },
    "갈매기 떼":  { hp: 6,  dmg: 2, lv: 0, atk: 2, def: 1, flee: 1 },
    "고블린":     { hp: 10, dmg: 3, lv: 1, atk: 2, def: 2 },
    "멧돼지":     { hp: 12, dmg: 3, lv: 1, atk: 2, def: 3 },
    "독사":       { hp: 7,  dmg: 3, lv: 1, atk: 3, def: 2 },
    "전갈":       { hp: 9,  dmg: 3, lv: 1, atk: 3, def: 2 },
    "모래 도마뱀": { hp: 9,  dmg: 3, lv: 1, atk: 3, def: 2 },
    "늑대":       { hp: 11, dmg: 3, lv: 1, atk: 2, def: 3, flee: 2 },
    "악어":       { hp: 15, dmg: 4, lv: 2, atk: 3, def: 2, gimmick: { type: "hide", name: "물속 매복", desc: "물속에 숨어 내 공격이 더 잘 빗나간다 (공격 난이도 한 단계 위)",
                      stat: "재주", tier: 2, ok: "미끼 덫으로 악어를 물 밖으로 끌어냈다!", fail: "미끼를 놓쳤고 악어가 달려든다!" } },
    "해골 병사":  { hp: 13, dmg: 3, lv: 2, atk: 3, def: 2, gimmick: { type: "curse", name: "저주 오라", desc: "불길한 기운에 내 모든 판정이 -1 된다",
                      stat: "행운", tier: 2, ok: "행운을 믿고 징크스를 깨뜨렸다!", fail: "불운이 더 짙어진다..." } },
    "설원 늑대":  { hp: 14, dmg: 4, lv: 2, atk: 2, def: 3, flee: 3, gimmick: { type: "howl", name: "하울링", desc: "2라운드마다 동료가 달려들어 추가로 공격한다",
                      stat: "재주", tier: 2, ok: "올가미 덫으로 무리의 길목을 막았다!", fail: "덫이 허탕을 쳤고 울음이 더 커진다!" } },
    "곰":         { hp: 18, dmg: 4, lv: 3, atk: 3, def: 3, gimmick: { type: "rage", name: "광폭화", desc: "3라운드마다 곰의 공격력이 +1씩 오른다 (최대 +3)",
                      stat: "지력", tier: 3, ok: "먹이를 던져 곰을 진정시켰다!", fail: "곰이 더 흥분해 덤벼든다!" } },
    "골렘":       { hp: 18, dmg: 4, lv: 3, atk: 4, def: 2, gimmick: { type: "dmgCut", name: "돌 갑옷", desc: "단단한 돌 갑옷 때문에 내 공격 피해가 2 줄어든다",
                      stat: "감지", tier: 3, ok: "갑옷의 균열을 찾아냈다! 갑옷이 부서진다!", fail: "균열을 찾지 못했다. 골렘이 반격한다!" } }
  };
  /* 몬스터에 atk/def를 적지 않았을 때 쓰는 등급(lv)별 기본 단계 */
  const ATK_BY_LV = [1, 2, 3, 3];  // 공격: 매우 쉬움(6) / 쉬움(8) / 보통(10) / 보통(10)
  const DEF_BY_LV = [1, 2, 2, 3];  // 방어: 매우 쉬움(6) / 쉬움(8) / 쉬움(8) / 보통(10)
  let battle = null; // 전투 중일 때만 정보가 들어 있음

  function startBattle(to) {
    const pool = [...(places[to].mons || []), ...(places[current].mons || [])]; // 출발지와 목적지 근처 몬스터 중에서
    const name = pick(pool.length ? pool : Object.keys(monsters));
    const m = { name, ...monsters[name] };
    battle = { name: m.name, dmg: m.dmg, lv: m.lv || 0, flee: m.flee ?? (m.lv || 0),
               atk: m.atk ?? ATK_BY_LV[m.lv || 0], def: m.def ?? DEF_BY_LV[m.lv || 0],
               gimmick: m.gimmick ? { ...m.gimmick, active: true } : null, broken: false, round: 0,
               mHp: m.hp, mMax: m.hp, hp: 10, max: 10, to, log: [`${josa(m.name, "이", "가")} 덤벼든다!`], timer: null };
    if (battle.gimmick) battle.log.push(`[기믹] ${battle.gimmick.name}: ${battle.gimmick.desc} (파훼: ${battle.gimmick.stat})`);
    battleButtons();
    drawBattle();
    battle.timer = setTimeout(battleRound, 1500);
  }

  /* 전투 중 버튼: [도망친다]만 있습니다 (기믹 대응은 공격/방어처럼 라운드마다 무작위로 자동 발생) */
  function battleButtons() {
    $("choices").innerHTML = "";
    updateStatus(); // 전투 중에는 가방의 장비를 바꿔 낄 수 없음
    addBtn("도망친다", askEscape, "", "roll", `민첩 판정 / ${tierText(battleNeeds(battle).escapeTier)} (누르면 먼저 확인)`); // 전투 중 언제든 누를 수 있음
  }

  /* 이 몬스터를 상대로 필요한 합: 강한 몬스터(lv)일수록 공격/방어/도망이 모두 어려워지고, 기믹이 켜져 있으면 추가 불이익 */
  function battleNeeds(B) {
    const g = B.gimmick && B.gimmick.active ? B.gimmick.type : null;
    const atkTier = Math.min(5, B.atk + (g === "hide" ? 1 : 0)); // 물속 매복: 공격 난이도 한 단계 위
    return { attack: DIFF[atkTier - 1], attackTier: atkTier,
             guard: DIFF[B.def - 1], guardTier: B.def,
             escape: DIFF[Math.min(5, 2 + B.flee) - 1], escapeTier: Math.min(5, 2 + B.flee),
             mod: g === "curse" ? -1 : 0 }; // mod: 저주 기믹이 내 모든 판정에 주는 보정
  }

  /* 체력 막대, 필요한 합, 기믹, 최근 전투 기록을 화면에 그립니다 */
  function bar(n, max) { n = Math.max(n, 0); return "■".repeat(n) + "□".repeat(max - n); }
  function drawBattle() {
    const B = battle, n = battleNeeds(B), g = B.gimmick;
    setStory(`[전투] ${B.name} ${bar(B.mHp, B.mMax)} ${Math.max(B.mHp, 0)}/${B.mMax}\n` +
      `나 ${bar(B.hp, B.max)} ${Math.max(B.hp, 0)}/${B.max}\n` +
      `난이도: 공격(${attackStat()}) ${tierText(n.attackTier)} / 방어(반응) ${tierText(n.guardTier)} / 도망 ${tierText(n.escapeTier)}\n` +
      (g && g.active ? `기믹 - ${g.name}: ${g.desc} (자동 대응: ${g.stat} ${tierText(g.tier)})\n` : "") + "\n" +
      B.log.slice(-4).join("\n"));
  }

  /* 한 라운드: 라운드를 쓰는 행동은 [공격]과 [대응]뿐입니다 (대응은 기믹이 켜져 있을 때만 후보에 들어감).
     그 뒤 몬스터가 공격하고, 내 캐릭터의 [방어]는 라운드를 쓰지 않는 반응으로 따로 판정합니다. */
  function battleRound() {
    const B = battle; if (!B) return;
    const n = battleNeeds(B); B.round++;
    const g = B.gimmick && B.gimmick.active ? B.gimmick : null;
    const act = pick(g ? ["공격", "대응"] : ["공격"]);
    if (act === "대응") {
      // 기믹 대응: 전투에 쓰지 않는 스탯(재주/지력/감지/행운)으로 자동 판정. 성공하면 기믹이 사라짐
      const r = rollDice(statBonus(g.stat) + n.mod);
      if (meets(r, g.need)) { g.active = false; B.broken = true; B.log.push(`[${g.name} 대응] ${r.text}: 파훼 성공! ${g.ok}`); }
      else B.log.push(`[${g.name} 대응] ${r.text}: 실패... ${g.fail}`);
    } else {
      const st = attackStat();
      const r = rollDice(statBonus(st) + n.mod); // 무기 분류의 스탯(장비 포함) + 저주 보정
      if (meets(r, n.attack)) {
        let dmg = 2 + Math.floor(Math.max(0, r.total - n.attack) / 5) + (r.crit ? 2 : 0); // 목표를 넘긴 만큼(5마다 +1), 크리티컬이면 더 큰 피해
        if (g && g.type === "dmgCut") dmg = Math.max(1, dmg - 2); // 돌 갑옷
        B.mHp -= dmg;
        B.log.push(`[공격·${st}] ${r.text}: 명중! ${dmg} 피해를 줬다.`);
      } else B.log.push(`[공격·${st}] ${r.text}: 빗나갔다...`);
    }
    if (B.mHp > 0) monsterTurn();
    // 하울링: 2라운드마다 동료가 한 번 더 공격 (이번 라운드에 파훼했다면 일어나지 않음)
    if (B.mHp > 0 && B.gimmick && B.gimmick.active && B.gimmick.type === "howl" && B.round % 2 === 0) {
      B.log.push("[하울링] 동료 늑대가 달려든다!");
      monsterTurn();
    }
    endOrContinue();
  }

  /* 몬스터의 공격: 항상 명중합니다. 대신 내 캐릭터가 [방어]로 반응해, 라운드를 쓰지 않고 1D20을 굴려 막아냅니다.
     방어 판정에 성공(또는 크리티컬)하면 피해가 없고, 실패(또는 펌블)하면 몬스터의 공격력만큼 피해를 입습니다. */
  function monsterTurn() {
    const B = battle, n = battleNeeds(B);
    const rage = (B.gimmick && B.gimmick.active && B.gimmick.type === "rage") ? Math.min(3, Math.floor(B.round / 3)) : 0; // 광폭화
    const dmg = B.dmg + rage;
    const r = rollDice(statBonus("정신") + n.mod); // 방어 반응: 정신(장비 포함) + 저주 보정
    if (meets(r, n.guard)) B.log.push(`[방어] ${r.text}: ${B.name}의 공격을 막아냈다!`);
    else { B.hp -= dmg; B.log.push(`[방어] ${r.text}: 막지 못했다! ${B.name}에게 ${dmg} 피해를 입었다.`); }
  }

  /* 승패가 났는지 확인하고, 아니면 다음 라운드를 예약합니다 */
  function endOrContinue() {
    const B = battle; drawBattle();
    if (B.mHp <= 0) {
      const g = 1 + Math.floor(Math.random() * 3) + Math.floor(B.mMax / 8) + B.lv + (B.broken ? 3 : 0); gold += g; questKill(B.name); // 강한 몬스터 + 기믹 파훼 보너스 (+ 의뢰의 처치 수) // 승리 보상: 강한 몬스터일수록 금화가 많음
      return finishBattle(`${josa(B.name, "을", "를")} 쓰러뜨렸다! 승리! 금화 ${g}닢을 얻었다.`, "계속 가기", () => continueTrip(B.to));
    }
    if (B.hp <= 0) {
      hurt(5); // 패배하면 체력이 5 깎임
      return finishBattle("쓰러지고 말았다... 체력이 5 깎였다. 간신히 몸을 일으켰다.", "계속 가기", () => stamina <= 0 ? faint() : continueTrip(B.to));
    }
    B.timer = setTimeout(battleRound, 1500);
  }

  /* 도망 시도: 1D20 판정(강한 몬스터일수록 난이도가 높음)에 성공하면 도망, 실패하면 몬스터에게 공격받고 전투 계속 */
  function tryEscape() {
    const B = battle; if (!B) return;
    clearTimeout(B.timer);
    const n = battleNeeds(B);
    const r = rollDice(statBonus("민첩") + n.mod);
    if (meets(r, n.escape)) { B.log.push(`[도망] ${r.text}: 성공!`); return finishBattle("전력으로 달려 무사히 도망쳤다!", "돌아가기", backToStart); }
    B.log.push(`[도망] ${r.text}: 실패! 길이 막혔다.`);
    monsterTurn(false);
    endOrContinue();
  }

  /* 전투 종료: 결과를 보여주고 버튼 하나만 남깁니다 */
  function finishBattle(msg, label, next) {
    const B = battle; battle = null; clearTimeout(B.timer);
    setStory(B.log.slice(-3).join("\n") + "\n\n" + msg);
    $("choices").innerHTML = "";
    addBtn(label, next, "", "move");
  }

  /* 도망치거나 패배했을 때: 길 한가운데에서 출발했던 장소로 돌아갑니다 */
  function backToStart() {
    if (stamina <= 0) return faint(); // 체력이 바닥나면 마을로 실려 감
    $("choices").innerHTML = "";
    placeHero(current);
    runTimed(`${ro(places[current].name)} 되돌아가는 중...`, Number($("hero").dataset.half) || 3000, refresh);
  }

  /* 캐릭터 위치를 장소 좌표로 옮기는 작은 함수 */
  function placeHero(id) {
    $("hero").style.transform = `translate(${places[id].x}px, ${places[id].y}px)`;
    followHero(places[id].x);
  }

  /* 사건이 끝난 뒤, 멈춰 있던 길 한가운데에서 목적지까지 다시 출발합니다 */
  function continueTrip(to) {
    $("choices").innerHTML = "";
    const road = roadInfo(current, to);                    // 사건 동안 current는 아직 출발지
    const ms = road.seconds * TRAVEL_TIME_SCALE * 1000;
    $("hero").style.transitionDuration = (ms / 2000) + "s"; // 남은 절반 거리
    placeHero(to);
    runTimed(`${places[current].name}에서 ${ro(places[to].name)} 이동 중...`, ms / 2, () => arrive(to), { before: ms / 2 });
  }

  /* 캐릭터를 좌표(x, y)로 직접 옮기는 함수: 길 한가운데처럼 장소가 아닌 곳에 세울 때 씁니다 */
  function placeHeroAt(x, y) {
    $("hero").style.transform = `translate(${x}px, ${y}px)`;
    followHero(x);
  }

  /* ===== [12] 금화, 가방, 장소별 행동(채집, 상점, 숨겨진 보물) ===== */
  const STAMINA_MAX = 20; // 체력 최댓값
  let stamina = 20;       // 체력: 전투 패배, 함정으로 깎이고 마을에서 회복 (전투 중 HP와는 별개)
  let gold = 5;        // 가진 금화
  const bag = {};      // 가방: { 아이템이름: 개수 }
  const found = {};    // 숨겨진 보물을 이미 찾아낸 장소
  const sellPrice = { "회어": 3, "금린어": 8, "약초": 4, "독초": 5, "산딸기": 2, "나무 열매": 3, "버섯": 2, "독버섯": 4, "선인장 열매": 4, "회전초": 3, "철광석": 6, "유물 조각": 10 };   // 상인이 사 주는 기본 가격

  /* 채집 종류: items = [[재료, 확률(%)], ...] (크리티컬이면 마지막 재료가 확정), stat = 판정 스탯, tool = 필요한 도구, tier = 난이도 단계 */
  const GATHER = {
    fish:   { label: "낚시하기",  items: [["회어", 70], ["금린어", 30]],       stat: "재주", tool: "낚싯대", tier: 2 },
    herbA:  { label: "약초 채집", items: [["약초", 65], ["독초", 35]],         stat: "재주", tier: 2 },   // 채집A
    berryB: { label: "열매 따기", items: [["산딸기", 65], ["나무 열매", 35]],   stat: "재주", tier: 1 },   // 채집B
    mush:   { label: "버섯 따기", items: [["버섯", 65], ["독버섯", 35]],       stat: "재주", tier: 2 },
    desert: { label: "사막 채집", items: [["선인장 열매", 65], ["회전초", 35]], stat: "재주", tier: 2 },

  };
  const G = (type, over = {}) => ({ type, ...GATHER[type], ...over });

  /* 장소별 행동 목록
     gather : 채집 목록 (G(종류, 바꿀 값))
     hidden : 한 번만 찾을 수 있는 숨겨진 보물상자 (gold=보상)

     shop / smith / rest : 상점 / 대장간·훈련장 / 여관,  npc : 마을 사람 이름,  guard : 경비원 */
  const actions = {
    village:   { shop: true, rest: true, npc: { shop: "케르트", inn: "알토" },
                 hidden: { label: "마을 구석 살펴보기", tier: 3, gold: 15, text: "낡은 장독대 밑에서 숨겨진 보물상자를 찾았다!" } },

    mountainW: { gather: [G("herbA"), G("mush")],
                 hidden: { label: "정상 근처 살펴보기", tier: 3, gold: 12, text: "바위 아래에서 오래된 보물상자를 발견했다!" } },

    harbor:    { shop: true, smith: true, rest: true, npc: { shop: "포체", smith: "헤일리", inn: "나디아" },
                 hidden: { label: "부두 창고 살펴보기", tier: 3, gold: 18, text: "낡은 창고 구석에서 숨겨진 보물상자를 찾았다!" } },
    beach:     { gather: [G("fish", { doing: "바닷가에서 낚시" })] },
    canyon:    { gather: [G("berryB"), G("ore", { tier: 2 })],
                 hidden: { label: "절벽 틈 살펴보기", tier: 4, gold: 22, text: "절벽 틈에서 숨겨진 보물상자를 발견했다!" } },
    snowfield: { gather: [G("herbA", { tier: 3, doing: "눈을 헤치며 약초 채집" })] },
    snowtown:  { shop: true, smith: true, rest: true, npc: { shop: "헬라", smith: "파로", inn: "이사야" },
                 hidden: { label: "눈 덮인 헛간 살펴보기", tier: 4, gold: 25, text: "건초 더미 아래에서 숨겨진 보물상자를 발견했다!" } },
    caveN:     { gather: [G("ore"), G("fish", { doing: "지하 물웅덩이에서 낚시" })],
                 hidden: { label: "동굴 안쪽 살펴보기", tier: 4, gold: 20, text: "바위 틈 안쪽에서 숨겨진 보물상자를 발견했다!" } },
    caveS:     { gather: [G("ore")] },
    ruins:     { gather: [G("ore", { tier: 4, items: [["철광석", 50], ["유물 조각", 50]], doing: "유물 조각을 발굴" })],
                 hidden: { label: "제단 뒤 살펴보기", tier: 5, gold: 30, text: "무너진 제단 뒤에서 고대의 보물상자를 발견했다!" },
                 secret: { label: "숨겨진 길 찾기", tier: 4, road: ["ruins", "oasis"], text: "무너진 벽 너머로 모래에 덮인 좁은 길을 찾아냈다! 남서쪽 오아시스로 이어지는 듯하다." } },
